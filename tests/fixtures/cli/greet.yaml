name: cli-greet
version: 1
description: >
  Workflow do testów dymnych CLI: jeden skrypt i jedno pytanie do człowieka.
  Świadomie nie deklaruje `globals.workspace`, więc CLI tworzy pusty katalog
  roboczy, a skrypt jest wskazywany ścieżką bezwzględną przez wejście
  `script_path`. Dzięki temu test nigdy nie pisze do repozytorium.

inputs:
  - name: greeting
    type: string
    required: true
    description: Tekst, który skrypt ma ogłosić.
  - name: script_path
    type: string
    required: true
    description: Ścieżka bezwzględna do skryptu ogłaszającego.
  - name: is_experimental
    type: boolean
    required: false
    default: false
    description: Flaga logiczna — sprawdza, czy typy wejść są zachowane.

states:
  announce:
    description: Ogłasza powitanie i zapisuje je w kontekście.
    action:
      type: script
      command: "{{ inputs.script_path }}"
      args:
        - "{{ inputs.greeting }}"
      exit_codes:
        0: success
        1: failure
    outputs:
      - success
      - failure
    transitions:
      success: approve
      failure: failed

  approve:
    description: Człowiek zatwierdza ogłoszenie.
    action:
      type: human
      message: "Czy ogłoszenie jest w porządku?"
      inputs:
        - name: approval_status
          type: select
          required: true
          options:
            - approved
            - rejected
    outputs:
      - approved
      - rejected
    transitions:
      approved: completed
      rejected: failed

  completed:
    description: Gotowe.

  failed:
    description: Niepowodzenie.

terminal_states:
  - completed
  - failed
