name: cli-greet
version: 1
description: >
  A CLI smoke-test workflow: one script and one question for a human. It
  deliberately declares no `globals.workspace`, so the CLI creates an empty
  working directory, and the script is pointed at by an absolute path handed in
  through the `script_path` input. That is what keeps the test from ever
  writing into the repository.

inputs:
  - name: greeting
    type: string
    required: true
    description: The text the script announces.
  - name: script_path
    type: string
    required: true
    description: Absolute path to the announcing script.
  - name: is_experimental
    type: boolean
    required: false
    default: false
    description: A boolean flag — checks that input types are preserved.

states:
  announce:
    description: Announces the greeting and records it in the context.
    action:
      type: script
      command: "{{ inputs.script_path }}"
      args:
        - "{{ inputs.greeting }}"
      exit_codes:
        0: success
        1: failure
    outputs:
      - success
      - failure
    transitions:
      success: approve
      failure: failed

  approve:
    description: A human approves the announcement.
    action:
      type: human
      message: "Is the announcement all right?"
      inputs:
        - name: approval_status
          type: select
          required: true
          options:
            - approved
            - rejected
    outputs:
      - approved
      - rejected
    transitions:
      approved: completed
      rejected: failed

  completed:
    description: Done.

  failed:
    description: Failed.

terminal_states:
  - completed
  - failed
