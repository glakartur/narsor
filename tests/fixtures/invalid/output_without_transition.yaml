# §5.1: every label in `choices` needs a matching entry in `transitions`.
name: output-without-transition
version: 1

states:
  start:
    action:
      type: script
      command: ./run.sh
    choices:
      - success
      - partial_failure
    transitions:
      success: done

  done:
    description: Koniec.

terminal_states:
  - done
