# The workspace is prepared before any step runs: `steps.*` is not allowed.
name: step-reply-in-workspace
version: 1

globals:
  workspace:
    type: local
    path: "{{ steps.work.reply }}"

states:
  work:
    action:
      type: agent
      harness: claude-code
      prompt: Zaimplementuj.
    choices:
      - done
    transitions:
      done: finished

  finished:
    description: Koniec.

terminal_states:
  - finished
