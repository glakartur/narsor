# A step variable name must be a plain name: letters, digits and `_`.
name: invalid-required-variable-name
version: 1

states:
  work:
    action:
      type: agent
      harness: claude-code
      prompt: Zaimplementuj.
    variables:
      - name: pr-url
        description: Adres PR.
    choices:
      - label: done
        requires_variables:
          - pr-url
    transitions:
      done: finished

  finished:
    description: Koniec.

terminal_states:
  - finished
