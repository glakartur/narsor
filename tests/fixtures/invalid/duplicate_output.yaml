# §5.1: every label in `choices` is declared once, whichever form it takes — a
# bare label and a described one naming the same label are a duplicate.
name: duplicate-output
version: 1

states:
  start:
    action:
      type: script
      command: ./run.sh
    choices:
      - success
      - label: success
        description: The same label again, now with a description.
      - failure
    transitions:
      success: done
      failure: done

  done:
    description: Koniec.

terminal_states:
  - done
