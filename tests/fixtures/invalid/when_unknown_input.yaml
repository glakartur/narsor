# A condition may only name an input the workflow declares.
schema: v2
name: when-unknown-input
version: 1

states:
  work:
    action:
      type: agent
      prompt:
        - Do it.
        - when: inputs.nonexistent
          text: More.
    variables:
      - name: summary
    exit:
      next: done

  done:
    description: Finished.

terminal_states:
  done: completed
