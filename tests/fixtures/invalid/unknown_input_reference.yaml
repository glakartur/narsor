# §5.4: `{{ inputs.x }}` must name a declared input.
name: unknown-input-reference
version: 1

inputs:
  - name: feature_description
    type: string
    required: true

states:
  start:
    action:
      type: agent
      harness: claude-code
      prompt: Zaimplementuj {{ inputs.nonexistent }}.
    choices:
      - done
    transitions:
      done: finished

  finished:
    description: Koniec.

terminal_states:
  - finished
