# Five independent violations in one file, one per rule group:
#   1. `start` references an input that is not declared,
#   2. `start` declares the output `extra` without a transition,
#   3. `middle` has a script action with an empty command,
#   4. `middle` has a transition for `failure`, which is not among its choices,
#   5. `orphan` is unreachable from the initial state.
name: five-violations
version: 1

inputs:
  - name: description
    type: string
    required: true

states:
  start:
    action:
      type: agent
      harness: claude-code
      prompt: Zaimplementuj {{ inputs.missing }}.
    choices:
      - ok
      - extra
    transitions:
      ok: middle

  middle:
    action:
      type: script
      command: ""
    choices:
      - success
    transitions:
      success: done
      failure: done

  orphan:
    action:
      type: script
      command: ./orphan.sh
    choices:
      - success
    transitions:
      success: done

  done:
    description: Koniec.

terminal_states:
  - done
