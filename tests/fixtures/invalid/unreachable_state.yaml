# §5.1: `orphan` has no incoming transition, so nothing can ever enter it.
name: unreachable-state
version: 1

states:
  start:
    action:
      type: script
      command: ./run.sh
    choices:
      - success
    transitions:
      success: done

  orphan:
    action:
      type: script
      command: ./orphan.sh
    choices:
      - success
    transitions:
      success: done

  done:
    description: Koniec.

terminal_states:
  - done
