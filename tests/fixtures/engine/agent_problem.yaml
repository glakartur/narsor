name: agent-problem
version: 1
description: >
  An agent whose answer may carry no output label, so its step becomes a
  problem. `implemented` requires the `summary` a script after it reads;
  `needs_human_decision` leads to a human gate and requires nothing.

states:
  work:
    action:
      type: agent
      prompt: Implement the feature.
    variables:
      - { name: summary, description: What the step reports as summary. }
    choices:
      - label: implemented
        description: The feature is implemented.
        requires_variables: [summary]
      - label: needs_human_decision
        description: A person has to decide first.
    transitions:
      implemented: report
      needs_human_decision: resolve_ambiguity

  report:
    action:
      type: script
      command: ./print_json.sh
      args:
        - '{"choice": "ok"}'
      env:
        SUMMARY: "{{ context.summary }}"
    choices:
      - ok
    transitions:
      ok: finished

  resolve_ambiguity:
    action:
      type: human
      message: The agent needs a decision.
    choices:
      - accept
    transitions:
      accept: finished

  finished:
    description: Done.

terminal_states:
  finished: completed
