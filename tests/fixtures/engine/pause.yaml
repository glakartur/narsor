name: pausable
version: 1
description: >
  Two states whose first action takes long enough to be paused while it runs.
  Pausing means "do not start the next action" (D34), so the slow action still
  finishes and its transition is still taken.

states:
  slow:
    action:
      type: script
      command: ./sleep_then_emit.sh
      args:
        - "0.4"
        - '{"choice": "done", "variables": {"slow": "finished"}}'
    variables:
      - { name: slow, description: What the step reports as slow. }
    choices:
      - done
    transitions:
      done: fast

  fast:
    action:
      type: script
      command: ./print_json.sh
      args:
        - '{"choice": "done", "variables": {"fast": "finished"}}'
    variables:
      - { name: fast, description: What the step reports as fast. }
    choices:
      - done
    transitions:
      done: completed

  completed:
    description: Done.

terminal_states:
  - completed
