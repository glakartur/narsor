name: test-fix-loop
version: 1
description: >
  The `test -> fix_code -> test` cycle of WORKFLOW_SCHEMA.md §4, with the agent
  replaced by a script. The test state fails the first time and passes the
  second, so the loop runs twice and leaves through `success`.

states:
  test:
    action:
      type: script
      command: ./emit_after.sh
      args:
        - passes.txt
        - failure
        - success
    outputs:
      - success
      - failure
    transitions:
      success: completed
      failure: fix_code

  fix_code:
    action:
      type: script
      command: ./print_json.sh
      args:
        - '{"output": "fixed", "variables": {"fixed": true}}'
    outputs:
      - fixed
    transitions:
      fixed: test

  completed:
    description: The tests pass.

terminal_states:
  - completed
