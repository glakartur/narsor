name: entry-limit
version: 1
states:
  review:
    action: { type: agent, prompt: review }
    max_entries: 2
    variables:
      - { name: summary, description: What the operator completed by hand. }
    choices:
      - label: findings
      - clean
      - label: manual_complete
        requires_variables: [summary]
    transitions: { findings: fix, clean: completed, manual_complete: completed }
  fix:
    action: { type: agent, prompt: "fix {{ steps.review.reply }}" }
    max_entries: 2
    choices: [fixed]
    transitions: { fixed: review }
  completed: { description: done }
terminal_states: [completed]
