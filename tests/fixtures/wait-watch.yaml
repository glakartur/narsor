schema: v2
name: review-merge-request
version: 1
inputs:
  - name: mr_url
    type: string
    required: true
states:
  await_review:
    action:
      type: wait
      event_type: review.approved
      filter:
        mr_url: "{{ inputs.mr_url }}"
      timeout: 24h
      watch:
        observer: mr-review                 # A watch_list observer of the task's owner
        object: "{{ inputs.mr_url }}"       # Rendered when the step starts
        event_types: [review.approved, review.changes_requested]
    choices:
      received:
        next: merge
      timeout:
        next: remind
  merge:
    action:
      type: script
      command: merge
      args: ["{{ context.event.data.mr_url }}"]
    exit:
      next: done
  remind:
    action:
      type: script
      command: remind
      args: ["{{ inputs.mr_url }}"]
    exit:
      next: reminded
  done:
    description: Merged.
  reminded:
    description: Nobody approved in time.
terminal_states:
  done: completed
  reminded: completed
