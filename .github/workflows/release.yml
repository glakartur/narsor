name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Test and build release assets
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""

      - name: Test workspace
        run: cargo test --locked --workspace

      - name: Build and inspect release archive
        run: bash dist/package-linux.sh

      - name: Smoke-test packaged binaries
        shell: bash
        run: |
          set -euo pipefail
          archive=dist/release/narsor-linux-x86_64-gnu.tar.gz
          checksum=dist/release/narsor-linux-x86_64-gnu.tar.gz.sha256
          (cd dist/release && sha256sum --check "$(basename "$checksum")")
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          tar -xzf "$archive" -C "$temp_dir"
          "$temp_dir/narsor-cli" --version
          "$temp_dir/narsor-cli" validate tests/fixtures/cli/greet.yaml
          for binary in narsor narsor-server narsor-controller narsor-runner; do
            "$temp_dir/$binary" --help >/dev/null
          done

      - name: Add installer to release files
        run: cp dist/install.sh dist/release/install.sh

      - name: Upload release inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release
          path: dist/release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Attest and publish release
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate tag and default-branch ancestry
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release tags must have the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          git fetch origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" || {
            echo "tag commit is not reachable from the default branch" >&2
            exit 1
          }

      - name: Download verified build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-release
          path: dist/release

      - name: Verify archive checksum
        run: (cd dist/release && sha256sum --check narsor-linux-x86_64-gnu.tar.gz.sha256)

      - name: Attest release archive
        id: provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/release/narsor-linux-x86_64-gnu.tar.gz

      - name: Include provenance bundle in release
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/release/provenance.jsonl

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            dist/release/install.sh
            dist/release/narsor-linux-x86_64-gnu.tar.gz
            dist/release/narsor-linux-x86_64-gnu.tar.gz.sha256
            dist/release/provenance.jsonl
          )
          # Release (i tag) tworzy człowiek; pipeline dołącza zweryfikowane pliki.
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify published assets and provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist/release && sha256sum --check narsor-linux-x86_64-gnu.tar.gz.sha256)
          assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for asset in \
            install.sh \
            narsor-linux-x86_64-gnu.tar.gz \
            narsor-linux-x86_64-gnu.tar.gz.sha256 \
            provenance.jsonl; do
            grep -Fxq "$asset" <<<"$assets" || {
              echo "release is missing asset: $asset" >&2
              exit 1
            }
          done
          gh attestation verify \
            dist/release/narsor-linux-x86_64-gnu.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
