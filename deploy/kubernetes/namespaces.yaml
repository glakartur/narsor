# Two namespaces keep the trust planes apart (KTD6):
#
# * narsor-system — the environment controller. Nothing else runs here.
# * narsor-tasks  — task Pods, their PVCs and launch Secrets, and the tool
#   credentials tasks may mount (the backend's trust namespace). Pod Security
#   Admission enforces the "restricted" profile on top of Narsor's own
#   admission policy (admission-policy.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: narsor-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: narsor-tasks
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
