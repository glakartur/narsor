# The identity every task Pod runs as: no token is mounted and no Role or
# ClusterRole is bound to it, so a task workload has zero Kubernetes API
# permissions (KTD6). The admission policy admits task Pods only with this
# service account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: narsor-task
  namespace: narsor-user
automountServiceAccountToken: false
