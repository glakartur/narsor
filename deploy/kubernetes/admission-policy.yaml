# Admission control for the task namespace (KTD6). The controller may create
# Pods, and creating a Pod is a secret-injection capability; these policies
# admit exactly the shape src/backends/kubernetes/manifest.rs generates
# (`check_pod_shape` there mirrors every rule) and refuse anything else, so a
# compromised controller cannot run a foreign image, mount an unapproved
# Secret, reach the host or borrow another identity.
#
# Requires Kubernetes 1.30+ (ValidatingAdmissionPolicy v1). Pod Security
# Admission "restricted" on the namespace (namespaces.yaml) covers the rest of
# the security context (sysctls, SELinux, AppArmor, proc mount).

# Parameters: keep them identical to the controller's backend.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: narsor-admission
  namespace: narsor-tasks
data:
  workloadServiceAccount: narsor-task
  storageClass: narsor-delete
  # Comma-separated registry prefixes, each ending in '/'.
  allowedRegistries: registry.example/,ghcr.io/narsor/
  # Comma-separated `secret-name/key` pairs a task may mount.
  allowedSecrets: narsor-github/token
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: narsor-task-pods
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
    - name: volumes
      expression: "has(object.spec.volumes) ? object.spec.volumes : []"
    - name: registries
      expression: "params.data.allowedRegistries.split(',').map(r, r.trim()).filter(r, r != '')"
    - name: secrets
      expression: >-
        has(params.data.allowedSecrets)
        ? params.data.allowedSecrets.split(',').map(s, s.trim()).filter(s, s != '')
        : []
  validations:
    - expression: "object.spec.serviceAccountName == params.data.workloadServiceAccount"
      message: "task Pods must run as the zero-RBAC workload service account"
    - expression: >-
        has(object.spec.automountServiceAccountToken) &&
        object.spec.automountServiceAccountToken == false
      message: "task Pods must not mount a service-account token"
    - expression: >-
        !(has(object.spec.hostNetwork) && object.spec.hostNetwork) &&
        !(has(object.spec.hostPID) && object.spec.hostPID) &&
        !(has(object.spec.hostIPC) && object.spec.hostIPC)
      message: "host namespaces are not allowed"
    - expression: "object.spec.restartPolicy == 'Never'"
      message: "task Pods never restart on their own (R13)"
    - expression: "!has(object.spec.ephemeralContainers)"
      message: "ephemeral containers are not allowed"
    - expression: >-
        has(object.spec.securityContext) &&
        has(object.spec.securityContext.runAsNonRoot) &&
        object.spec.securityContext.runAsNonRoot == true
      message: "task Pods run as non-root"
    - expression: "variables.containers.all(c, c.image.matches('@sha256:[0-9a-f]{64}$'))"
      message: "every image must be pinned by digest"
    - expression: >-
        variables.containers.all(c, variables.registries.exists(r, c.image.startsWith(r)))
      messageExpression: "'images must come from: ' + params.data.allowedRegistries"
    - expression: >-
        variables.containers.all(c, !has(c.securityContext) ||
        !has(c.securityContext.privileged) || c.securityContext.privileged == false)
      message: "privileged containers are not allowed"
    - expression: >-
        variables.containers.all(c, has(c.securityContext) &&
        has(c.securityContext.allowPrivilegeEscalation) &&
        c.securityContext.allowPrivilegeEscalation == false)
      message: "allowPrivilegeEscalation must be false"
    - expression: >-
        variables.containers.all(c, has(c.securityContext) &&
        has(c.securityContext.capabilities) &&
        has(c.securityContext.capabilities.drop) &&
        'ALL' in c.securityContext.capabilities.drop &&
        (!has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0))
      message: "containers must drop ALL capabilities and add none"
    - expression: >-
        variables.containers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort)))
      message: "host ports are not allowed"
    - expression: >-
        variables.containers.all(c, !has(c.envFrom) &&
        (!has(c.env) || c.env.all(e, !has(e.valueFrom))))
      message: "secrets reach a task only through approved volume mappings, never env references"
    - expression: >-
        variables.volumes.all(v, !has(v.hostPath) &&
        (has(v.emptyDir) || has(v.persistentVolumeClaim) || has(v.secret) || has(v.projected)))
      message: "only emptyDir, the task's PVC, its launch Secret and projected approved secrets"
    - expression: >-
        variables.volumes.all(v, !has(v.persistentVolumeClaim) ||
        v.persistentVolumeClaim.claimName == object.metadata.name + '-storage')
      message: "a task Pod mounts only its own task storage"
    - expression: >-
        variables.volumes.all(v, !has(v.secret) ||
        v.secret.secretName.startsWith(object.metadata.name + '-launch-'))
      message: "a task Pod mounts only its own launch Secret"
    - expression: >-
        variables.volumes.all(v, !has(v.projected) ||
        v.projected.sources.all(s, has(s.secret) && has(s.secret.items) &&
        size(s.secret.items) > 0 &&
        s.secret.items.all(i, (s.secret.name + '/' + i.key) in variables.secrets)))
      message: "projected volumes may map only approved secret/key pairs (allowedSecrets)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: narsor-task-pods
spec:
  policyName: narsor-task-pods
  validationActions: [Deny]
  paramRef:
    name: narsor-admission
    namespace: narsor-tasks
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: narsor-tasks
---
# Task storage: only the configured storage class (whose reclaim policy makes
# archive destroy the data), only Narsor's names, and never a copy of — or a
# binding to — someone else's volume. CREATE only: the volume binder later
# updates spec.volumeName.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: narsor-task-storage
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["persistentvolumeclaims"]
  validations:
    - expression: >-
        has(object.spec.storageClassName) &&
        object.spec.storageClassName == params.data.storageClass
      message: "task storage uses the configured storage class"
    - expression: >-
        object.metadata.name.startsWith('narsor-') && object.metadata.name.endsWith('-storage')
      message: "task storage carries a Narsor name"
    - expression: >-
        !has(object.spec.dataSource) && !has(object.spec.dataSourceRef) &&
        !has(object.spec.volumeName)
      message: "task storage starts empty and binds no pre-existing volume"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: narsor-task-storage
spec:
  policyName: narsor-task-storage
  validationActions: [Deny]
  paramRef:
    name: narsor-admission
    namespace: narsor-tasks
    parameterNotFoundAction: Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: narsor-tasks
