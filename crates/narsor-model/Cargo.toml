[package]
name = "narsor-model"
version = "0.1.0"
edition = "2021"

[lib]
name = "narsor_model"
path = "src/lib.rs"

[dependencies]
narsor-protocol = { path = "../narsor-protocol" }
narsor-shared = { path = "../narsor-shared" }

chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
