[package]
name = "narsor-observer-worker"
version = "0.1.0"
edition = "2021"

[lib]
name = "narsor_observer_worker"
path = "src/lib.rs"

[[bin]]
name = "narsor-observer-worker"
path = "src/main.rs"

[dependencies]
narsor-api-client = { path = "../narsor-api-client" }
narsor-protocol = { path = "../narsor-protocol" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"

[dev-dependencies]
# The stand-in control plane of tests/program.rs.
axum = { version = "0.8", features = ["macros"] }
