[package]
name = "narsor-store"
version = "0.1.0"
edition = "2021"

[lib]
name = "narsor_store"
path = "src/lib.rs"

[dependencies]
narsor-model = { path = "../narsor-model" }
narsor-protocol = { path = "../narsor-protocol" }

base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
zstd = "0.14"
