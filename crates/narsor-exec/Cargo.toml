[package]
name = "narsor-exec"
version = "0.1.0"
edition = "2021"

[lib]
name = "narsor_exec"
path = "src/lib.rs"

[features]
default = []
# Runs `harness: github-copilot` steps through the GitHub Copilot SDK.
# Without it such a step fails with an error that names narsor-runner.
copilot-sdk = ["dep:github-copilot-sdk"]

[dependencies]
narsor-model = { path = "../narsor-model" }
narsor-protocol = { path = "../narsor-protocol" }
narsor-shared = { path = "../narsor-shared" }
narsor-store = { path = "../narsor-store" }

base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
# The GitHub Copilot harness. Optional and off by default: only
# `narsor-runner` runs agent steps, so only it enables `copilot-sdk`.
# `bundled-cli` (the SDK's default) is off on purpose: it embeds the whole
# Copilot CLI runtime (~200 MB). The operator installs the `copilot` CLI.
github-copilot-sdk = { version = "1.0", default-features = false, features = ["runtime"], optional = true }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
