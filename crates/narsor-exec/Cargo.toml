[package]
name = "narsor-exec"
version = "0.1.0"
edition = "2021"

[lib]
name = "narsor_exec"
path = "src/lib.rs"

[dependencies]
narsor-model = { path = "../narsor-model" }
narsor-protocol = { path = "../narsor-protocol" }
narsor-shared = { path = "../narsor-shared" }
narsor-store = { path = "../narsor-store" }

base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
github-copilot-sdk = "1.0"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
