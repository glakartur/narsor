[package]
name = "narsor-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
narsor-engine = { path = "../narsor-engine", features = ["engine"] }
narsor-protocol = { path = "../narsor-protocol" }
bytes = "1"
clap = { version = "4.6.7", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
