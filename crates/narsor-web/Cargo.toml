[package]
name = "narsor-web"
version = "0.1.0"
edition = "2021"

[lib]
name = "narsor_web"
path = "src/lib.rs"

[[bin]]
name = "narsor-web"
path = "src/main.rs"

[dependencies]
narsor-api-client = { path = "../narsor-api-client" }
narsor-protocol = { path = "../narsor-protocol" }
narsor-shared = { path = "../narsor-shared" }
axum = { version = "0.8" }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
include_dir = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
