[package]
name = "narsor-web"
version = "0.1.0"
edition = "2021"

[lib]
name = "narsor_web"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8" }
include_dir = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
