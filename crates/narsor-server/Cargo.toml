[package]
name = "narsor-server"
version = "0.1.0"
edition = "2021"

[dependencies]
narsor = { path = "../.." }
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
