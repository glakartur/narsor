[package]
name = "narsor-server"
version = "0.1.0"
edition = "2021"

[dependencies]
narsor-engine = { path = "../narsor-engine", features = ["engine"] }
narsor-shared = { path = "../narsor-shared" }
narsor-api-client = { path = "../narsor-api-client" }
narsor-protocol = { path = "../narsor-protocol" }
narsor-controller-runtime = { path = "../narsor-controller-runtime" }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
