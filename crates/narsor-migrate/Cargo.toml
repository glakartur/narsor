[package]
name = "narsor-migrate"
version = "0.1.0"
edition = "2021"

[lib]
name = "narsor_migrate"
path = "src/lib.rs"

[[bin]]
name = "narsor-migrate"
path = "src/main.rs"

[dependencies]
narsor-shared = { path = "../narsor-shared" }
narsor-store = { path = "../narsor-store" }
narsor-model = { path = "../narsor-model" }
narsor-protocol = { path = "../narsor-protocol" }
# Only for the typed paths of the local controller's directories
# (`ControllerStatePaths`, `ControllerWorkPaths`): the tool writes the files
# that controller reads.
narsor-controller = { path = "../narsor-controller" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.10", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Reads runtime.yaml for script paths that leave components/ (runtime-catalog).
serde_yaml = "0.9"
sha2 = "0.11"
tar = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.14"

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
