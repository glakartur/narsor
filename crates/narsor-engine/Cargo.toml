[package]
name = "narsor-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "narsor_engine"
path = "src/lib.rs"

[dependencies]
narsor-protocol = { path = "../narsor-protocol" }
narsor-shared = { path = "../narsor-shared" }
narsor-model = { path = "../narsor-model" }
narsor-store = { path = "../narsor-store" }
narsor-exec = { path = "../narsor-exec" }
narsor-controller-client = { path = "../narsor-controller-client" }
narsor-controller-runtime = { path = "../narsor-controller-runtime" }

tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls"] }
bytes = "1"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
ipnet = "2"
# Five-field cron schedules of observers (observers/schedule_expr.rs).
croner = "4.0"
