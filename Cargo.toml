[package]
name = "narsor"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Filesystem & Path handling
path-absolutize = "3"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# UUID generation
uuid = { version = "1", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Git integration is done by invoking the `git` command-line tool
# (see src/workspace/provisioner.rs), which is a runtime prerequisite.

# Validation
validator = { version = "0.16", features = ["derive"] }

# SSE support
axum-extra = { version = "0.9", features = ["typed-header"] }
futures = "0.3"
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
crossterm = "0.29.0"

# Conversation log compression (closed attempts only, see src/persistence/conversation.rs)
zstd = "0.13"

# Lossless byte-for-byte encoding of raw harness lines inside a JSONL envelope
base64 = "0.22"

# HTTP client for the embedded API (src/api/client.rs). No TLS and no default
# middleware: the server is loopback-only (see src/api/mod.rs), so the extra
# default features would be dead weight.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
