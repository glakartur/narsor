[package]
name = "narsor"
version = "0.1.0"
edition = "2021"
default-run = "narsor"
autobins = false

[lib]
name = "narsor"
path = "src/client_lib.rs"

[[bin]]
name = "narsor"
path = "src/bin/narsor.rs"

[[bin]]
name = "narsor-cli"
path = "src/main.rs"

[workspace]
members = [
    ".",
    "crates/narsor-api-client",
    "crates/narsor-controller",
    "crates/narsor-controller-runtime",
    "crates/narsor-engine",
    "crates/narsor-protocol",
    "crates/narsor-shared",
    "crates/narsor-runner",
    "crates/narsor-server",
]
resolver = "2"

[dependencies]
narsor-protocol = { path = "crates/narsor-protocol" }
narsor-shared = { path = "crates/narsor-shared" }
narsor-api-client = { path = "crates/narsor-api-client" }

tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Filesystem & Path handling
# Error handling
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Git integration is done by invoking the `git` command-line tool
# (see crates/narsor-engine/src/workspace/provisioner.rs), which is a runtime prerequisite.

# Async streams used by the client and task presentation.
futures = "0.3"
# "env": `narsor-controller` reads its settings from flags or environment
# variables (a Deployment sets env, an operator types flags).
clap = { version = "4.6.7", features = ["derive", "env"] }
ratatui = "0.30.2"
crossterm = "0.29.0"

# Client payloads and transcript decoding.
sha2 = "0.11"
base64 = "0.23"

# Byte buffers returned by the API client.
bytes = "1"


[dev-dependencies]
axum = { version = "0.8", features = ["macros"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls"] }
serde_yaml = "0.9"
narsor-server = { path = "crates/narsor-server" }
narsor-controller = { path = "crates/narsor-controller" }
narsor-controller-runtime = { path = "crates/narsor-controller-runtime" }
narsor-engine = { path = "crates/narsor-engine" }
# ES256 keys for the in-process mock OIDC issuer of tests/auth.rs. Already in
# the tree through jsonwebtoken's `rust_crypto`.
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
rand = "0.10"
# EdDSA test keys exported as PKCS#8, the form jsonwebtoken signs with.
ed25519-dalek = { version = "3", features = ["alloc", "rand_core", "pkcs8"] }
