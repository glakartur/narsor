name: compound-engineering
version: 1
description: >
  The compound engineering chain, end to end: ce-brainstorm to ce-plan to
  ce-work to ce-code-review to ce-commit-push-pr to human review to
  ce-compound and a final push/review, with
  ce-doc-review over the requirements, ce-simplify-code before review and
  ce-resolve-pr-feedback on the open pull request. The pipeline stops for a
  person at scope and plan approval, and reviews the pushed PR after
  implementation and again after any learning document is added. During
  implementation an agent can pause and ask a question, then resume the same
  action with the person's answer.

inputs:
  - name: feature_description
    type: text
    required: true
    description: The idea, problem or feature to explore, plan and ship.
  - name: target_repo
    type: repository
    required: true
    description: The repository the work happens in.

display:
  title: "{{ inputs.feature_description }}"
  links:
    - label: PR
      text: "{{ context.variables.pr_url }}"
      url: "{{ context.variables.pr_url }}"

globals:
  timeout: 4h
  workspace:
    type: git
    repository: "{{ inputs.target_repo }}"

states:
  # -------------------------------------------------------------------------
  # WHAT to build
  # -------------------------------------------------------------------------

  brainstorm:
    description: >
      ce-brainstorm — explore the request through dialogue and write a
      right-sized requirements document.
    action:
      type: agent
      prompt: |
        Run the `ce-brainstorm` skill with these arguments:

        {{ inputs.feature_description }}

    outputs:
      - label: requirements_drafted
        description: the requirements document is written.
        requires_variables:
          - name: requirements_doc
            description: repo-relative path of the requirements document you wrote or revised.
      - label: needs_direction
        description: >-
          the request is too open to write requirements for without a human
          choosing a direction first.
    transitions:
      requirements_drafted: doc_review
      needs_direction: clarify_direction
    timeout: 45m

  clarify_direction:
    description: >
      HUMAN GATE — the brainstorm found no direction it could take on its own.
      Only the person who wants the feature can pick one.
    action:
      type: human
      message: >
        The brainstorm could not settle a direction. Say which way to go, or
        stop here — an agent guessing the product direction is exactly the
        decision it has no basis to make.
      inputs:
        - name: direction_decision
          type: select
          required: true
          options:
            - retry_brainstorm
            - abandon
        - name: direction_note
          type: text
          required: true
          description: The direction to explore, in your own words.
    outputs:
      - label: retry_brainstorm
        description: brainstorm again, in the direction given in the note.
      - label: abandon
        description: stop the pipeline here.
    transitions:
      retry_brainstorm: brainstorm
      abandon: cancelled

  doc_review:
    description: >
      ce-doc-review — parallel persona agents read the requirements document
      and surface role-specific issues before anyone plans against it.
    action:
      type: agent
      prompt: |
        Run the `ce-doc-review` skill with these arguments: mode:headless {{ context.requirements_doc }}
    outputs:
      - label: reviewed
        description: the document was reviewed and the findings recorded.
        requires_human_approval: true
    transitions:
      reviewed: approve_scope
    timeout: 30m
    retry_policy:
      max_attempts: 2
      backoff: 30s

  approve_scope:
    description: >
      HUMAN GATE — is the scope right? The requirements document is what every
      later step is measured against; a wrong scope corrected here costs one
      conversation, corrected after the PR it costs the whole pipeline.
    action:
      type: human
      message: >
        Read the requirements document and its review. Approve the scope, send
        it back for another brainstorm, or stop. An optional note is carried
        into the plan; a revision request goes back to the brainstorm.
      inputs:
        - name: scope_decision
          type: select
          required: true
          options:
            - approved
            - revise
            - abandon
        - name: scope_notes
          type: text
          required: false
          description: >
            Optional — what the plan must respect beyond the requirements
            document: constraints or non-goals.
        - name: brainstorm_feedback
          type: text
          required: true
          description: >
            Only for revise — what the requirements document gets wrong.
    outputs:
      - label: approved
        description: the scope is right; plan against it.
      - label: revise
        description: send the requirements back for another brainstorm.
        resume_comment_field: brainstorm_feedback
      - label: abandon
        description: stop the pipeline here.
    transitions:
      approved: plan
      revise: brainstorm
      abandon: cancelled

  # -------------------------------------------------------------------------
  # HOW to build it
  # -------------------------------------------------------------------------

  plan:
    description: >
      ce-plan — turn the approved requirements into a durable implementation
      plan with files, test scenarios and sequencing.
    action:
      type: agent
      prompt: |
        Run the `ce-plan` skill with these arguments: {{ context.requirements_doc }}

        Reviewer's note on scope:
        {{ context.scope_notes }}

        ---
        For `needs_scope_revision`, put the contradiction or missing dependency in `data.question`.
    outputs:
      - label: plan_ready
        description: the plan is written and an implementer could start.
        requires_variables:
          - name: plan_doc
            description: repo-relative path of the plan.
      - label: needs_scope_revision
        description: >-
          the approved requirements cannot be planned as written.
    transitions:
      plan_ready: approve_plan
      needs_scope_revision: approve_scope
    timeout: 1h
    retry_policy:
      max_attempts: 2
      backoff: 1m

  approve_plan:
    description: >
      HUMAN GATE — the last point before code exists. Everything after this is
      an edit to the repository; a correction made here is free, and the same
      correction made after the work is a rewrite.
    action:
      type: human
      message: >
        Read the plan. Approve it and the agent starts writing code; send it
        back and it replans; abandon and nothing is written. This is the
        cheapest place in the pipeline to change your mind.
      inputs:
        - name: plan_decision
          type: select
          required: true
          options:
            - approved
            - revise
            - abandon
        - name: plan_feedback
          type: text
          required: false
          description: Optional — what the plan gets wrong.
    outputs:
      - label: approved
        description: the plan is right; start writing code.
      - label: revise
        description: send the plan back to be replanned.
      - label: abandon
        description: stop before any code is written.
    transitions:
      approved: work
      revise: plan_revision
      abandon: cancelled

  # -------------------------------------------------------------------------
  # Doing the work
  # -------------------------------------------------------------------------

  plan_revision:
    description: >
      Replan after the human's feedback on the proposed implementation plan.
    action:
      type: agent
      prompt: |
        Run the `ce-plan` skill with these arguments: {{ context.plan_doc }}

        Requirements: {{ context.requirements_doc }}
        Feedback on the plan:
        {{ context.plan_feedback }}

        ---
    outputs:
      - label: plan_ready
        description: the revised plan is ready for approval.
        requires_variables:
          - name: plan_doc
            description: repo-relative path of the revised plan.
    transitions:
      plan_ready: approve_plan
    timeout: 1h
    retry_policy:
      max_attempts: 2
      backoff: 1m

  work:
    description: >
      ce-work — execute the approved plan, following existing patterns and
      keeping the tests green. The skill ships its own work: it reviews,
      commits, pushes and opens the pull request.
    action:
      type: agent
      prompt: |
        Run the `ce-work` skill with these arguments: {{ context.plan_doc }}

        Run the plan's relevant checks before implementation and record their concise result as `test_baseline` in the final output. Preserve that baseline: do not repair pre-existing failures or investigate them as part of this plan.

        ---
        Set `variables.pr_url` to the pull request URL, if one was opened.
    outputs:
      - label: implemented
        description: the plan is implemented and the checks pass.
        requires_variables:
          - name: test_baseline
            description: concise result of checks run before implementation, including pre-existing failures or “all passed”.
    transitions:
      implemented: simplify
    timeout: 2h

  work_revision:
    description: >
      Shared continuation of implementation for changes from human review or
      PR feedback. Both routes re-enter here before simplify and automated
      review; ce-resolve-pr-feedback pushes its own fixes.
    action:
      type: agent
      prompt: |
        Run the `ce-work` skill with these arguments: {{ context.plan_doc }}

        Test baseline captured before implementation:
        {{ context.test_baseline }}
        Preserve this baseline: do not repair pre-existing failures or investigate them as part of this plan.

        Changes requested in review:
        {{ context.revision_notes }}

        If the current branch has an open pull request, then also run the `ce-resolve-pr-feedback` skill.
    outputs:
      - label: revised
        description: requested changes are made and checks pass.
    transitions:
      revised: simplify
    timeout: 1h

  simplify:
    description: >
      ce-simplify-code — refine what was just written for clarity, reuse and
      efficiency, without changing behaviour.
    action:
      type: agent
      prompt: |
        Run the `ce-simplify-code` skill.
    outputs:
      - label: simplified
        description: simplifications were applied and the checks pass.
      - label: unchanged
        description: the code is already as simple as it should be.
    transitions:
      simplified: code_review
      unchanged: code_review
    timeout: 45m
    retry_policy:
      max_attempts: 2
      backoff: 1m

  # -------------------------------------------------------------------------
  # Review, and going public
  # -------------------------------------------------------------------------

  code_review:
    description: >
      ce-code-review in autofix mode — tiered persona agents, confidence
      gating, merged and deduplicated findings. Safe fixes are applied in
      bounded rounds; the residual findings are passed to the fix step and
      another review cycle.
    action:
      type: agent
      prompt: |
        Run the `ce-code-review` skill with these arguments: mode:autofix plan:{{ context.plan_doc }}

    outputs:
      - label: clean
        description: no actionable findings survived the confidence gate.
      - label: findings
        description: findings need automatic fixes before another review cycle.
    transitions:
      clean: publish_work
      findings: fix_review_findings
    timeout: 1h
    max_entries: 5
    retry_policy:
      max_attempts: 2
      backoff: 1m

  implementation_review:
    description: >
      HUMAN GATE — reached after the implementation has been pushed to the
      pull request. The person reviews that published PR and decides whether
      to request changes, approve it, or stop.
    action:
      type: human
      message: >
        The implementation has been pushed to the pull request. Review the PR,
        including feedback from its reviewers. Request changes with actionable
        notes, approve it, or stop.
      inputs:
        - name: review_decision
          type: select
          required: true
          options:
            - revise
            - approve
            - abandon
        - name: revision_notes
          type: text
          required: true
          description: What to change, or "none" if approving or abandoning.
    outputs:
      - label: revise
        description: send the PR back for changes named in the note.
      - label: approve
        description: the person approves the PR after reviewing the pushed changes.
      - label: abandon
        description: stop the pipeline here.
    transitions:
      revise: work_revision
      approve: compound
      abandon: cancelled

  fix_review_findings:
    description: Automatically address findings from the code review.
    action:
      type: agent
      prompt: |
        Fix these findings from the code review. Do not perform an independent review of the diff; only address the listed residual actionable work.

        {{ steps.code_review.reply }}

        Test baseline captured before implementation:
        {{ context.test_baseline }}
        Preserve this baseline: do not repair pre-existing failures or investigate them as part of this plan.
    outputs:
      - label: fixed
        description: findings are fixed; run automated review again.
    transitions:
      fixed: code_review
    timeout: 1h

  publish_work:
    description: >
      Publish the implementation: open a PR for a new branch, or push to the
      existing PR and describe the new changes in a PR comment.
    action:
      type: agent
      prompt: |
        Run the `ce-commit-push-pr` skill. If the branch already has an open pull request, do not rewrite its description: add a pull request comment that describes the new changes.

    outputs:
      - label: published
        description: the branch is pushed and the new or existing PR is current.
        requires_variables:
          - name: pr_url
            description: URL of the current pull request.
    transitions:
      published: implementation_review
    timeout: 30m

  publish_learning:
    description: >
      Push the learning written after human review to the existing pull
      request, then ask for a final human review of the updated PR.
    action:
      type: agent
      prompt: |
        Run the `ce-commit-push-pr` skill. If the branch already has an open pull request, do not rewrite its description: add a pull request comment that describes the new changes.
    outputs:
      - label: updated
        description: the learning is pushed to the existing pull request.
    transitions:
      updated: learning_review
    timeout: 30m

  learning_review:
    description: >
      HUMAN GATE — final review after the learning document was pushed to the
      already reviewed pull request.
    action:
      type: human
      message: >
        The learning document has been added to the approved pull request and
        pushed. Review the updated PR. Approve it, request changes, or stop.
      inputs:
        - name: learning_review_decision
          type: select
          required: true
          options:
            - approve
            - revise
            - abandon
        - name: revision_notes
          type: text
          required: true
          description: What to change, or "none" if approving or abandoning.
    outputs:
      - label: approve
        description: the updated pull request is approved; finish the workflow.
      - label: revise
        description: send the updated pull request back for changes.
      - label: abandon
        description: stop the pipeline here.
    transitions:
      approve: finished
      revise: work_revision
      abandon: cancelled

  compound:
    description: >
      ce-compound — the step that makes the engineering compound: write down
      what was learned so the next run starts further along.
    action:
      type: agent
      prompt: |
        Run the `ce-compound` skill with these arguments: mode:headless
    outputs:
      - label: documented
        description: a learning document was written.
      - label: nothing_to_document
        description: this run taught nothing that is not already written down.
    transitions:
      documented: publish_learning
      nothing_to_document: finished
    timeout: 30m
    retry_policy:
      max_attempts: 2
      backoff: 30s

  # -------------------------------------------------------------------------
  # Terminals
  # -------------------------------------------------------------------------

  finished:
    description: Merged-ready work, reviewed, published and its learning written down.

  cancelled:
    description: A person stopped the pipeline.

terminal_states:
  finished: completed
  cancelled: cancelled
