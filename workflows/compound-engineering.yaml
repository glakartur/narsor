name: compound-engineering
version: 1
description: >
  The compound engineering chain, end to end: ce-brainstorm to ce-plan to
  ce-work to ce-code-review to human review to ce-compound, publishing the
  requirements, plan, implementation and learning to one pull request, with
  ce-doc-review over the requirements, ce-simplify-code before review and
  ce-resolve-pr-feedback on the open pull request. The pipeline stops for a
  person at scope and plan approval. PR feedback is resolved after each push;
  the person reviews the current PR at each gate. During
  implementation an agent can pause and ask a question, then resume the same
  action with the person's answer.

inputs:
  - name: feature_description
    type: text
    required: true
    description: The idea, problem or feature to explore, plan and ship.
  - name: target_repo
    type: repository
    required: true
    description: The repository the work happens in.

display:
  title: "{{ inputs.feature_description }}"
  links:
    - label: PR
      text: "{{ context.variables.pr_url }}"
      url: "{{ context.variables.pr_url }}"

globals:
  timeout: 4h
  workspace:
    type: git
    repository: "{{ inputs.target_repo }}"

states:
  # -------------------------------------------------------------------------
  # WHAT to build
  # -------------------------------------------------------------------------

  brainstorm:
    description: >
      ce-brainstorm — explore the request through dialogue and write a
      right-sized requirements document.
    action:
      type: agent
      prompt: |
        Run the `ce-brainstorm` skill with these arguments:

        {{ inputs.feature_description }}

    variables:
      - name: requirements_doc
        description: repo-relative path of the requirements document you wrote or revised.
    choices:
      - label: requirements_drafted
        description: the requirements document is written.
        requires_variables: [requirements_doc]
      - label: needs_direction
        description: >-
          the request is too open to write requirements for without a human
          choosing a direction first.
    transitions:
      requirements_drafted: doc_review
      needs_direction: clarify_direction
    timeout: 45m

  clarify_direction:
    description: >
      HUMAN GATE — the brainstorm found no direction it could take on its own.
      Only the person who wants the feature can pick one.
    action:
      type: human
      message: >
        The brainstorm could not settle a direction. Say which way to go, or
        stop here — an agent guessing the product direction is exactly the
        decision it has no basis to make.
      inputs:
        - name: direction_decision
          type: select
          required: true
          options:
            - retry_brainstorm
            - abandon
        - name: direction_note
          type: text
          required: true
          description: The direction to explore, in your own words.
    choices:
      - label: retry_brainstorm
        description: brainstorm again, in the direction given in the note.
      - label: abandon
        description: stop the pipeline here.
    transitions:
      retry_brainstorm: brainstorm
      abandon: cancelled

  doc_review:
    description: >
      ce-doc-review — parallel persona agents read the requirements document
      and surface role-specific issues before anyone plans against it.
    action:
      type: agent
      prompt: |
        Run the `ce-doc-review` skill with these arguments: mode:headless {{ context.requirements_doc }}
    choices:
      - label: reviewed
        description: the document was reviewed and the findings recorded.
        requires_human_approval: true
    transitions:
      reviewed: publish_scope
    timeout: 30m
    retry_policy:
      max_attempts: 2
      backoff: 30s

  publish_scope:
    description: Publish the reviewed requirements to the pull request.
    action:
      type: agent
      prompt: |
        Run the `ce-commit-push-pr` skill with `mode:pipeline babysit:off`. Open a PR if this branch has none, or push the reviewed requirements to its existing PR without rewriting the description. Report the PR URL.
    variables:
      - name: pr_url
        description: URL of the open pull request for this branch.
    choices:
      - label: published
        description: the reviewed requirements are available on the PR.
        requires_variables: [pr_url]
    transitions:
      published: resolve_scope_feedback
    timeout: 30m

  resolve_scope_feedback:
    description: Address feedback already posted on the requirements PR.
    action:
      type: agent
      prompt: |
        Run the `ce-resolve-pr-feedback` skill with `mode:pipeline {{ context.pr_url }}`. Process all unresolved PR feedback. If there is no actionable feedback, report `no_feedback`; if fixes were pushed, report `fixed`; if a decision or pending review prevents resolution, report `needs_human` with the PR thread URL and reason. The person reviews the current PR next.
    choices:
      - label: no_feedback
        description: no actionable PR feedback remains.
      - label: fixed
        description: PR feedback was addressed and pushed for review.
      - label: needs_human
        description: unresolved feedback needs a decision on the PR.
    transitions:
      no_feedback: approve_scope
      fixed: approve_scope
      needs_human: approve_scope
    timeout: 1h

  approve_scope:
    description: >
      HUMAN GATE — is the scope right? The requirements document is what every
      later step is measured against; a wrong scope corrected here costs one
      conversation, corrected after the PR it costs the whole pipeline.
    action:
      type: human
      message: >
        Read the requirements document and its review on the PR. Address any
        unresolved PR thread that needs your decision. Approve the scope, send
        it back for another brainstorm, or stop. An optional note is carried
        into the plan; a revision request goes back to the brainstorm.
      inputs:
        - name: scope_decision
          type: select
          required: true
          options:
            - approved
            - revise
            - abandon
        - name: scope_notes
          type: text
          required: false
          description: >
            Optional — what the plan must respect beyond the requirements
            document: constraints or non-goals.
        - name: brainstorm_feedback
          type: text
          required: true
          description: >
            Only for revise — what the requirements document gets wrong.
    choices:
      - label: approved
        description: the scope is right; plan against it.
      - label: revise
        description: send the requirements back for another brainstorm.
        resume_comment_field: brainstorm_feedback
      - label: abandon
        description: stop the pipeline here.
    transitions:
      approved: confirm_scope_feedback
      revise: brainstorm
      abandon: cancelled

  confirm_scope_feedback:
    description: Recheck PR feedback posted while scope approval was pending.
    action:
      type: agent
      prompt: |
        Run the `ce-resolve-pr-feedback` skill with `mode:pipeline {{ context.pr_url }}`. Check feedback added while the scope review was pending. Report `no_feedback` if nothing actionable remains; report `fixed` if fixes were pushed; report `needs_human` if a decision or pending review prevents resolution, with its PR URL and reason. Any change returns the PR to scope approval.
    choices:
      - label: no_feedback
        description: scope approval stands and planning can begin.
      - label: fixed
        description: requirements changed on the PR and need renewed approval.
      - label: needs_human
        description: an unresolved PR decision needs renewed human review.
    transitions:
      no_feedback: plan
      fixed: approve_scope
      needs_human: approve_scope
    timeout: 1h

  # -------------------------------------------------------------------------
  # HOW to build it
  # -------------------------------------------------------------------------

  plan:
    description: >
      ce-plan — turn the approved requirements into a durable implementation
      plan with files, test scenarios and sequencing.
    action:
      type: agent
      prompt: |
        Run the `ce-plan` skill with these arguments: {{ context.requirements_doc }}

        Reviewer's note on scope:
        {{ context.scope_notes }}

        ---
        For `needs_scope_revision`, put the contradiction or missing dependency in `data.question`.
    variables:
      - name: plan_doc
        description: repo-relative path of the plan.
    choices:
      - label: plan_ready
        description: the plan is written and an implementer could start.
        requires_variables: [plan_doc]
      - label: needs_scope_revision
        description: >-
          the approved requirements cannot be planned as written.
    transitions:
      plan_ready: publish_plan
      needs_scope_revision: approve_scope
    timeout: 1h
    retry_policy:
      max_attempts: 2
      backoff: 1m

  publish_plan:
    description: Push the plan to the same pull request before approval.
    action:
      type: agent
      prompt: |
        Run the full `ce-commit-push-pr` workflow with `mode:pipeline babysit:off`. Push the plan to the existing PR on this branch, {{ context.pr_url }}, without rewriting its description. Report the PR URL.
    choices:
      - label: updated
        description: the current plan is available on the PR.
    transitions:
      updated: resolve_plan_feedback
    timeout: 30m

  resolve_plan_feedback:
    description: Address feedback already posted on the plan PR.
    action:
      type: agent
      prompt: |
        Run the `ce-resolve-pr-feedback` skill with `mode:pipeline {{ context.pr_url }}`. Process all unresolved PR feedback. If there is no actionable feedback, report `no_feedback`; if fixes were pushed, report `fixed`; if a decision or pending review prevents resolution, report `needs_human` with the PR thread URL and reason. The person reviews the current PR next.
    choices:
      - label: no_feedback
        description: no actionable PR feedback remains.
      - label: fixed
        description: PR feedback was addressed and pushed for review.
      - label: needs_human
        description: unresolved feedback needs a decision on the PR.
    transitions:
      no_feedback: approve_plan
      fixed: approve_plan
      needs_human: approve_plan
    timeout: 1h

  approve_plan:
    description: >
      HUMAN GATE — the last point before code exists. Everything after this is
      an edit to the repository; a correction made here is free, and the same
      correction made after the work is a rewrite.
    action:
      type: human
      message: >
        Read the plan on the PR and address any unresolved thread needing your
        decision. Approve it and the agent starts writing code; send it
        back and it replans; abandon and nothing is written. This is the
        cheapest place in the pipeline to change your mind.
      inputs:
        - name: plan_decision
          type: select
          required: true
          options:
            - approved
            - revise
            - abandon
        - name: plan_feedback
          type: text
          required: false
          description: Optional — what the plan gets wrong.
    choices:
      - label: approved
        description: the plan is right; start writing code.
      - label: revise
        description: send the plan back to be replanned.
      - label: abandon
        description: stop before any code is written.
    transitions:
      approved: confirm_plan_feedback
      revise: plan_revision
      abandon: cancelled

  confirm_plan_feedback:
    description: Recheck PR feedback posted while plan approval was pending.
    action:
      type: agent
      prompt: |
        Run the `ce-resolve-pr-feedback` skill with `mode:pipeline {{ context.pr_url }}`. Check feedback added while the plan review was pending. Report `no_feedback` if nothing actionable remains; report `fixed` if fixes were pushed; report `needs_human` if a decision or pending review prevents resolution, with its PR URL and reason. Any change returns the PR to plan approval.
    choices:
      - label: no_feedback
        description: plan approval stands and implementation can begin.
      - label: fixed
        description: the plan changed on the PR and needs renewed approval.
      - label: needs_human
        description: an unresolved PR decision needs renewed human review.
    transitions:
      no_feedback: work
      fixed: approve_plan
      needs_human: approve_plan
    timeout: 1h

  # -------------------------------------------------------------------------
  # Doing the work
  # -------------------------------------------------------------------------

  plan_revision:
    description: >
      Replan after the human's feedback on the proposed implementation plan.
    action:
      type: agent
      prompt: |
        Run the `ce-plan` skill with these arguments: {{ context.plan_doc }}

        Requirements: {{ context.requirements_doc }}
        Feedback on the plan:
        {{ context.plan_feedback }}

        ---
    variables:
      - name: plan_doc
        description: repo-relative path of the revised plan.
    choices:
      - label: plan_ready
        description: the revised plan is ready for approval.
        requires_variables: [plan_doc]
    transitions:
      plan_ready: publish_plan
    timeout: 1h
    retry_policy:
      max_attempts: 2
      backoff: 1m

  work:
    description: >
      ce-work — execute the approved plan, following existing patterns and
      keeping the tests green. The workflow owns review and publication.
    action:
      type: agent
      prompt: |
        Run the `ce-work` skill with these arguments: mode:return-to-caller {{ context.plan_doc }}

        Run the plan's relevant checks before implementation and record their concise result as `test_baseline` in the final output. Preserve that baseline: do not repair pre-existing failures or investigate them as part of this plan.

    variables:
      - name: test_baseline
        description: concise result of checks run before implementation, including pre-existing failures or “all passed”.
    choices:
      - label: implemented
        description: the plan is implemented and the checks pass.
        requires_variables: [test_baseline]
    transitions:
      implemented: simplify
    timeout: 2h

  work_revision:
    description: >
      Shared continuation of implementation for changes from human review or
      PR feedback. Both routes re-enter here before simplify and automated
      review.
    action:
      type: agent
      prompt: |
        First run the `ce-resolve-pr-feedback` skill with `mode:pipeline {{ context.pr_url }}` to address review comments already on the PR. It commits and pushes its fixes. If it reports a decision needed, leave that thread open for the human gate.

        Run the `ce-work` skill with these arguments: mode:return-to-caller {{ context.plan_doc }}

        Test baseline captured before implementation:
        {{ context.test_baseline }}
        Preserve this baseline: do not repair pre-existing failures or investigate them as part of this plan.

        Changes requested in review:
        {{ context.revision_notes }}

        Implement any remaining changes requested in the review note. Include fixes pushed by the resolver in the subsequent simplify and code review.
    choices:
      - label: revised
        description: requested changes are made and checks pass.
    transitions:
      revised: simplify
    timeout: 1h

  simplify:
    description: >
      ce-simplify-code — refine what was just written for clarity, reuse and
      efficiency, without changing behaviour.
    action:
      type: agent
      prompt: |
        Run the `ce-simplify-code` skill.
    choices:
      - label: simplified
        description: simplifications were applied and the checks pass.
      - label: unchanged
        description: the code is already as simple as it should be.
    transitions:
      simplified: code_review
      unchanged: code_review
    timeout: 45m
    retry_policy:
      max_attempts: 2
      backoff: 1m

  # -------------------------------------------------------------------------
  # Review, and going public
  # -------------------------------------------------------------------------

  code_review:
    description: >
      ce-code-review in report mode — findings are passed to the fix step and
      another review cycle.
    action:
      type: agent
      prompt: |
        Run the `ce-code-review` skill with these arguments: mode:agent plan:{{ context.plan_doc }}

    choices:
      - label: clean
        description: no actionable findings survived the confidence gate.
      - label: findings
        description: findings need assessment and possible fixes before publication.
    transitions:
      clean: verify_work
      findings: fix_review_findings
    timeout: 1h
    max_entries: 5
    retry_policy:
      max_attempts: 2
      backoff: 1m

  implementation_review:
    description: >
      HUMAN GATE — reached after the implementation has been pushed to the
      pull request. The person reviews that published PR and decides whether
      to request changes, approve it, or stop.
    action:
      type: human
      message: >
        The implementation has been pushed to the pull request. Review the PR,
        including feedback from its reviewers. Request changes with actionable
        notes, approve it, or stop.
      inputs:
        - name: review_decision
          type: select
          required: true
          options:
            - revise
            - approve
            - abandon
        - name: revision_notes
          type: text
          required: true
          description: What to change, or "none" if approving or abandoning.
    choices:
      - label: revise
        description: send the PR back for changes named in the note.
      - label: approve
        description: the person approves the PR after reviewing the pushed changes.
      - label: abandon
        description: stop the pipeline here.
    transitions:
      revise: work_revision
      approve: confirm_work_feedback
      abandon: cancelled

  confirm_work_feedback:
    description: Recheck PR feedback posted while implementation review was pending.
    action:
      type: agent
      prompt: |
        Run the `ce-resolve-pr-feedback` skill with `mode:pipeline {{ context.pr_url }}`. Check feedback added while implementation review was pending. Report `no_feedback` if nothing actionable remains; report `fixed` if fixes were pushed; report `needs_human` if a decision or pending review prevents resolution, with its PR URL and reason. Any change returns the PR to implementation review.
    choices:
      - label: no_feedback
        description: implementation approval stands and learning can be captured.
      - label: fixed
        description: implementation changed on the PR and needs renewed review.
      - label: needs_human
        description: an unresolved PR decision needs renewed human review.
    transitions:
      no_feedback: compound
      fixed: implementation_review
      needs_human: implementation_review
    timeout: 1h

  fix_review_findings:
    description: Address code-review findings, repeating review only if files changed.
    action:
      type: agent
      prompt: |
        Fix these findings from the code review. Do not perform an independent review of the diff; only address the listed residual actionable work.

        {{ steps.code_review.reply }}

        Test baseline captured before implementation:
        {{ context.test_baseline }}
        Preserve this baseline: do not repair pre-existing failures or investigate them as part of this plan.

        Compare repository file content before and after this step, including any committed edits. If you changed files, report `fixed`. If no files changed because the findings need no actionable edit, report `unchanged` with a concise reason. Do not use `unchanged` when a required fix remains unresolved.
    choices:
      - label: fixed
        description: files changed while addressing findings; run automated review again.
      - label: unchanged
        description: no actionable file changes were needed; run repository checks.
    transitions:
      fixed: code_review
      unchanged: verify_work
    timeout: 1h

  verify_work:
    description: >
      Run the repository's optional formatting, build and test checks before
      publishing code. Only a missing script skips the checks.
    action:
      type: script
      command: bash
      args:
        - -c
        - |
          if [ ! -e scripts/verify.sh ] && [ ! -L scripts/verify.sh ]; then
            exit 2
          fi
          if [ ! -f scripts/verify.sh ]; then
            echo 'scripts/verify.sh exists but is not a regular file' >&2
            exit 1
          fi
          printf '[verify_work] repository checks\n'
          bash scripts/verify.sh
          result=$?
          printf '\n[verify_work] finished with exit code %s\n' "$result"
          if [ "$result" -eq 0 ]; then
            exit 0
          fi
          exit 1
      env:
        CI: "true"
      exit_codes:
        0: passed
        1: failed
        2: skipped
    choices:
      - label: passed
        description: the repository's formatting, build and test checks passed.
      - label: failed
        description: an existing verification script failed and needs repair.
      - label: skipped
        description: the repository has no scripts/verify.sh.
    transitions:
      passed: publish_work
      failed: repair_verification
      skipped: publish_work
    timeout: 2h

  repair_verification:
    description: Fix a failed repository check before review and publication.
    action:
      type: agent
      prompt: |
        The repository's `scripts/verify.sh` failed in `verify_work`. Diagnose the failure from this captured output; do not rerun the complete script in this step. Fix the cause. The workflow will simplify, review and rerun the complete script before publishing.

        Captured stdout from verify_work:
        {{ steps.verify_work.stdout }}

        Captured stderr from verify_work:
        {{ steps.verify_work.stderr }}

        Approved plan: {{ context.plan_doc }}
        Test baseline before implementation: {{ context.test_baseline }}
        Preserve that baseline: do not repair pre-existing failures unrelated to this work. If the script or environment is broken independently of this change, report the blocker instead of removing or bypassing the check.
    choices:
      - label: repaired
        description: the check failure was repaired; simplify and review the changes.
    transitions:
      repaired: simplify
    timeout: 1h
    max_entries: 5

  publish_work:
    description: >
      Publish the reviewed implementation to the existing PR.
    action:
      type: agent
      prompt: |
        Run the `ce-commit-push-pr` skill with `mode:pipeline babysit:off`. It detects the existing open PR on this branch; do not rewrite its description. Publish only the reviewed implementation changes and report its URL.

    variables:
      - name: pr_url
        description: URL of the current pull request.
    choices:
      - label: published
        description: the branch is pushed and the new or existing PR is current.
        requires_variables: [pr_url]
    transitions:
      published: resolve_work_feedback
    timeout: 30m

  resolve_work_feedback:
    description: Address feedback already posted on the implementation PR.
    action:
      type: agent
      prompt: |
        Run the `ce-resolve-pr-feedback` skill with `mode:pipeline {{ context.pr_url }}`. Process all unresolved PR feedback. If there is no actionable feedback, report `no_feedback`; if fixes were pushed, report `fixed`; if a decision or pending review prevents resolution, report `needs_human` with the PR thread URL and reason. The person reviews the current PR next.
    choices:
      - label: no_feedback
        description: no actionable PR feedback remains.
      - label: fixed
        description: PR feedback was addressed and pushed for review.
      - label: needs_human
        description: unresolved feedback needs a decision on the PR.
    transitions:
      no_feedback: implementation_review
      fixed: implementation_review
      needs_human: implementation_review
    timeout: 1h

  publish_learning:
    description: >
      Push the learning written after human review to the existing pull
      request, then ask for a final human review of the updated PR.
    action:
      type: agent
      prompt: |
        Run the `ce-commit-push-pr` skill with `mode:pipeline babysit:off`. Update the existing open PR on this branch without rewriting its description. Report its URL.
    choices:
      - label: updated
        description: the learning is pushed to the existing pull request.
    transitions:
      updated: resolve_learning_feedback
    timeout: 30m

  resolve_learning_feedback:
    description: Address feedback already posted on the updated PR.
    action:
      type: agent
      prompt: |
        Run the `ce-resolve-pr-feedback` skill with `mode:pipeline {{ context.pr_url }}`. Process all unresolved PR feedback. If there is no actionable feedback, report `no_feedback`; if fixes were pushed, report `fixed`; if a decision or pending review prevents resolution, report `needs_human` with the PR thread URL and reason. The person reviews the current PR next.
    choices:
      - label: no_feedback
        description: no actionable PR feedback remains.
      - label: fixed
        description: PR feedback was addressed and pushed for review.
      - label: needs_human
        description: unresolved feedback needs a decision on the PR.
    transitions:
      no_feedback: learning_review
      fixed: learning_review
      needs_human: learning_review
    timeout: 1h

  learning_review:
    description: >
      HUMAN GATE — final review after the learning document was pushed to the
      already reviewed pull request.
    action:
      type: human
      message: >
        The learning document has been added to the approved pull request and
        pushed. Review the updated PR. Approve it, request changes, or stop.
      inputs:
        - name: learning_review_decision
          type: select
          required: true
          options:
            - approve
            - revise
            - abandon
        - name: revision_notes
          type: text
          required: true
          description: What to change, or "none" if approving or abandoning.
    choices:
      - label: approve
        description: the updated pull request is approved; finish the workflow.
      - label: revise
        description: send the updated pull request back for changes.
      - label: abandon
        description: stop the pipeline here.
    transitions:
      approve: confirm_learning_feedback
      revise: work_revision
      abandon: cancelled

  confirm_learning_feedback:
    description: Recheck PR feedback posted while final review was pending.
    action:
      type: agent
      prompt: |
        Run the `ce-resolve-pr-feedback` skill with `mode:pipeline {{ context.pr_url }}`. Check feedback added while final review was pending. Report `no_feedback` if nothing actionable remains; report `fixed` if fixes were pushed; report `needs_human` if a decision or pending review prevents resolution, with its PR URL and reason. Any change returns the PR to final review.
    choices:
      - label: no_feedback
        description: final approval stands and the workflow can finish.
      - label: fixed
        description: the PR changed and needs renewed final review.
      - label: needs_human
        description: an unresolved PR decision needs renewed human review.
    transitions:
      no_feedback: finished
      fixed: learning_review
      needs_human: learning_review
    timeout: 1h

  compound:
    description: >
      ce-compound — the step that makes the engineering compound: write down
      what was learned so the next run starts further along.
    action:
      type: agent
      prompt: |
        Run the `ce-compound` skill with these arguments: mode:headless
    choices:
      - label: documented
        description: a learning document was written.
      - label: nothing_to_document
        description: this run taught nothing that is not already written down.
    transitions:
      documented: publish_learning
      nothing_to_document: finished
    timeout: 30m
    retry_policy:
      max_attempts: 2
      backoff: 30s

  # -------------------------------------------------------------------------
  # Terminals
  # -------------------------------------------------------------------------

  finished:
    description: Merged-ready work, reviewed, published and its learning written down.

  cancelled:
    description: A person stopped the pipeline.

terminal_states:
  finished: completed
  cancelled: cancelled
