name: compound-engineering
version: 1
description: >
  The compound engineering chain, end to end: ce-brainstorm to ce-plan to
  ce-work to ce-code-review to ce-commit-push-pr to human review to
  ce-compound and a final push/review, with
  ce-doc-review over the requirements, ce-simplify-code before review and
  ce-resolve-pr-feedback on the open pull request. The pipeline stops for a
  person at scope and plan approval, and reviews the pushed PR after
  implementation and again after any learning document is added. During
  implementation an agent can pause and ask a question, then resume the same
  action with the person's answer.

inputs:
  - name: feature_description
    type: text
    required: true
    description: The idea, problem or feature to explore, plan and ship.
  - name: target_repo
    type: repository
    required: true
    description: The repository the work happens in.

display:
  title: "{{ inputs.feature_description }}"
  links:
    - label: PR
      text: "{{ context.variables.pr_url }}"
      url: "{{ context.variables.pr_url }}"

globals:
  timeout: 4h
  workspace:
    type: git
    repository: "{{ inputs.target_repo }}"
    ref: main

states:
  # -------------------------------------------------------------------------
  # WHAT to build
  # -------------------------------------------------------------------------

  brainstorm:
    description: >
      ce-brainstorm — explore the request through dialogue and write a
      right-sized requirements document.
    action:
      type: agent
      prompt: |
        Run the `ce-brainstorm` skill for this request:

        {{ inputs.feature_description }}

        Answer WHAT to build, not HOW. Resolve product behaviour, scope
        boundaries and success criteria, and write the requirements document
        to `docs/brainstorms/<date>-<slug>-requirements.md` using
        repo-relative paths. Do not write production code.

        End every answer, including one after a revision request, with a
        single JSON object and nothing after it:
          {"output": "<label>", "variables": {"requirements_doc": "<repo-relative path>"}}
        `requirements_doc` names the one document you wrote or revised; the
        later steps read exactly that file.
    outputs:
      - label: requirements_drafted
        description: the requirements document is written.
      - label: needs_direction
        description: >-
          the request is too open to write requirements for without a human
          choosing a direction first.
    transitions:
      requirements_drafted: doc_review
      needs_direction: clarify_direction
    timeout: 45m

  clarify_direction:
    description: >
      HUMAN GATE — the brainstorm found no direction it could take on its own.
      Only the person who wants the feature can pick one.
    action:
      type: human
      message: >
        The brainstorm could not settle a direction. Say which way to go, or
        stop here — an agent guessing the product direction is exactly the
        decision it has no basis to make.
      inputs:
        - name: direction_decision
          type: select
          required: true
          options:
            - retry_brainstorm
            - abandon
        - name: direction_note
          type: text
          required: true
          description: The direction to explore, in your own words.
    outputs:
      - label: retry_brainstorm
        description: brainstorm again, in the direction given in the note.
      - label: abandon
        description: stop the pipeline here.
    transitions:
      retry_brainstorm: brainstorm
      abandon: cancelled

  doc_review:
    description: >
      ce-doc-review — parallel persona agents read the requirements document
      and surface role-specific issues before anyone plans against it.
    action:
      type: agent
      prompt: |
        Run the `ce-doc-review` skill over the requirements document written by
        `ce-brainstorm`: `{{ context.requirements_doc }}`. Dispatch the persona reviewers,
        merge their findings and write the review back into the document as a
        review section. Change no code.

        End your answer with a single JSON object and nothing after it:
          {"output": "<label>", "data": {"findings": <count>}}
        If the review cannot be produced because the document is missing, the
        harness fails, or a tool is unavailable, report an action failure;
        do not emit a workflow output for an execution error.
    outputs:
      - label: reviewed
        description: the document was reviewed and the findings recorded.
        requires_human_approval: true
    transitions:
      reviewed: approve_scope
    timeout: 30m
    retry_policy:
      max_attempts: 2
      backoff: 30s

  approve_scope:
    description: >
      HUMAN GATE — is the scope right? The requirements document is what every
      later step is measured against; a wrong scope corrected here costs one
      conversation, corrected after the PR it costs the whole pipeline.
    action:
      type: human
      message: >
        Read the requirements document and its review. Approve the scope, send
        it back for another brainstorm, or stop. An optional note is carried
        into the plan; a revision request goes back to the brainstorm.
      inputs:
        - name: scope_decision
          type: select
          required: true
          options:
            - approved
            - revise
            - abandon
        - name: scope_notes
          type: text
          required: false
          description: >
            Optional — what the plan must respect beyond the requirements
            document: constraints or non-goals.
        - name: brainstorm_feedback
          type: text
          required: true
          description: >
            Only for revise — what the requirements document gets wrong.
    outputs:
      - label: approved
        description: the scope is right; plan against it.
      - label: revise
        description: send the requirements back for another brainstorm.
        resume_comment_field: brainstorm_feedback
      - label: abandon
        description: stop the pipeline here.
    transitions:
      approved: plan
      revise: brainstorm
      abandon: cancelled

  # -------------------------------------------------------------------------
  # HOW to build it
  # -------------------------------------------------------------------------

  plan:
    description: >
      ce-plan — turn the approved requirements into a durable implementation
      plan with files, test scenarios and sequencing.
    action:
      type: agent
      prompt: |
        Run the `ce-plan` skill. Build from this requirements document — it is
        the source of truth; do not use any other document in
        `docs/brainstorms/`:

        {{ context.requirements_doc }}

        Respect the reviewer's note, if there is one:

        {{ context.scope_notes }}

        Produce a plan in `docs/plans/` with a problem frame, scope
        boundaries, repo-relative file paths, explicit test file paths,
        enumerated test scenarios and decisions with rationale. Decisions, not
        code: write no implementation.

        End your answer with a single JSON object and nothing after it:
          {"output": "<label>", "variables": {"plan_doc": "<repo-relative path>"}}
        If you take `needs_scope_revision`, explain the contradiction or
        missing dependency in `data.question` so a person can revise the scope.
        A sandbox, harness, tool, or write-permission problem is an action
        failure, not `needs_scope_revision`.
    outputs:
      - label: plan_ready
        description: the plan is written and an implementer could start.
      - label: needs_scope_revision
        description: >-
          the approved requirements cannot be planned as written.
    transitions:
      plan_ready: approve_plan
      needs_scope_revision: approve_scope
    timeout: 1h
    retry_policy:
      max_attempts: 2
      backoff: 1m

  approve_plan:
    description: >
      HUMAN GATE — the last point before code exists. Everything after this is
      an edit to the repository; a correction made here is free, and the same
      correction made after the work is a rewrite.
    action:
      type: human
      message: >
        Read the plan. Approve it and the agent starts writing code; send it
        back and it replans; abandon and nothing is written. This is the
        cheapest place in the pipeline to change your mind.
      inputs:
        - name: plan_decision
          type: select
          required: true
          options:
            - approved
            - revise
            - abandon
        - name: plan_feedback
          type: text
          required: true
          description: What the plan gets wrong, or "as written" if you approve it.
    outputs:
      - label: approved
        description: the plan is right; start writing code.
      - label: revise
        description: send the plan back to be replanned.
      - label: abandon
        description: stop before any code is written.
    transitions:
      approved: work
      revise: plan_revision
      abandon: cancelled

  # -------------------------------------------------------------------------
  # Doing the work
  # -------------------------------------------------------------------------

  plan_revision:
    description: >
      Replan after the human's feedback on the proposed implementation plan.
    action:
      type: agent
      prompt: |
        Run the `ce-plan` skill again. Revise the plan
        `{{ context.plan_doc }}` based on the approved requirements document
        `{{ context.requirements_doc }}` and this human feedback:

        {{ context.plan_feedback }}

        Keep the plan concrete: repo-relative file paths, test scenarios and
        sequencing. Write no implementation code.

        End your answer with a single JSON object and nothing after it:
          {"output": "<label>", "variables": {"plan_doc": "<repo-relative path>"}}
    outputs:
      - label: plan_ready
        description: the revised plan is ready for approval.
    transitions:
      plan_ready: approve_plan
    timeout: 1h
    retry_policy:
      max_attempts: 2
      backoff: 1m

  work:
    description: >
      ce-work — execute the approved plan, following existing patterns and
      keeping the tests green.
    action:
      type: agent
      prompt: |
        Run the `ce-work` skill against the plan `{{ context.plan_doc }}`. Implement
        the plan's units in order, write the tests the plan enumerates, and
        run the repository's own checks before you finish. Respect the plan's
        scope boundaries. If a requirement or implementation choice is
        ambiguous, do not guess: return an `awaiting_input` response with a
        clear question. The workflow pauses this agent action, delivers the
        person's answer, and resumes this same implementation step. Continue
        until the implementation is complete.

        End your answer with a single JSON object and nothing after it:
          {"output": "<label>", "data": {"units_completed": <count>}}
        A sandbox, harness, tool, or write-permission problem is an action
        failure, not a workflow output.
    outputs:
      - label: implemented
        description: the plan is implemented and the checks pass.
    transitions:
      implemented: simplify
    timeout: 2h

  work_revision:
    description: >
      Shared continuation of implementation for changes from human review or
      PR feedback. Both routes re-enter here before simplify and automated
      review.
    action:
      type: agent
      prompt: |
        Run the `ce-work` skill against the approved plan `{{ context.plan_doc }}`.
        Continue the existing implementation and address the changes in the
        person's review note:

        {{ context.revision_notes }}

        If this branch already has an open pull request, also run
        `ce-resolve-pr-feedback`: judge each review thread on its merits,
        incorporate valid requests and reply to each thread. Do not push here;
        the shared simplify, automated review and human review steps run next.

        Keep changes within the approved plan, add regression tests where
        appropriate, and run the repository's checks. Do not push or open a PR.
        Return `revised` when the requested changes are complete; report an
        action failure if blocked.

        End your answer with a single JSON object and nothing after it:
          {"output": "revised", "data": {"files_touched": <count>}}
    outputs:
      - label: revised
        description: requested changes are made and checks pass.
    transitions:
      revised: simplify
    timeout: 1h

  simplify:
    description: >
      ce-simplify-code — refine what was just written for clarity, reuse and
      efficiency, without changing behaviour.
    action:
      type: agent
      prompt: |
        Run the `ce-simplify-code` skill over the code changed on this branch.
        Preserve behaviour exactly: the tests that passed before must pass
        after. Do not add features and do not widen the diff.

        End your answer with a single JSON object and nothing after it:
          {"output": "<label>", "data": {"files_touched": <count>}}
        If checks cannot pass after restoring the prior implementation, report
        an action failure; do not emit a workflow output for that error.
    outputs:
      - label: simplified
        description: simplifications were applied and the checks pass.
      - label: unchanged
        description: the code is already as simple as it should be.
    transitions:
      simplified: code_review
      unchanged: code_review
    timeout: 45m
    retry_policy:
      max_attempts: 2
      backoff: 1m

  # -------------------------------------------------------------------------
  # Review, and going public
  # -------------------------------------------------------------------------

  code_review:
    description: >
      ce-code-review in report-only mode — tiered persona agents, confidence
      gating, merged and deduplicated findings. Read-only on purpose; findings
      are sent to the implementation agent for automatic fixes and another
      review cycle.
    action:
      type: agent
      workspace_access: read-only
      prompt: |
        Run the `ce-code-review` skill with `mode:report-only` over the changes
        on this branch. Dispatch the persona reviewers, merge and deduplicate
        their findings, and report them with severity and file:line. Change
        nothing — no fixes, no commits.

        End your answer with a single JSON object and nothing after it:
          {"output": "<label>", "data": {"findings": <count>, "blockers": <count>}}
        If the review cannot be produced because no diff exists, the harness
        fails, or a tool is unavailable, report an action failure; do not emit
        a workflow output for an execution error.
    outputs:
      - label: clean
        description: no actionable findings survived the confidence gate.
      - label: findings
        description: findings need automatic fixes before another review cycle.
    transitions:
      clean: publish_work
      findings: fix_review_findings
    timeout: 1h
    retry_policy:
      max_attempts: 2
      backoff: 1m

  implementation_review:
    description: >
      HUMAN GATE — reached after the implementation has been pushed to the
      pull request. The person reviews that published PR and decides whether
      to request changes, approve it, or stop.
    action:
      type: human
      message: >
        The implementation has been pushed to the pull request. Review the PR,
        including feedback from its reviewers. Request changes with actionable
        notes, approve it, or stop.
      inputs:
        - name: review_decision
          type: select
          required: true
          options:
            - revise
            - approve
            - abandon
        - name: revision_notes
          type: text
          required: true
          description: What to change, or "none" if approving or abandoning.
    outputs:
      - label: revise
        description: send the PR back for changes named in the note.
      - label: approve
        description: the person approves the PR after reviewing the pushed changes.
      - label: abandon
        description: stop the pipeline here.
    transitions:
      revise: work_revision
      approve: compound
      abandon: cancelled

  fix_review_findings:
    description: Automatically address findings from the code review.
    action:
      type: agent
      prompt: |
        Address every actionable finding from the latest `ce-code-review`
        report. Fix causes rather than symptoms, add regression tests for
        behavioural findings, and run the repository's checks. Do not ask a
        person to triage findings: make the fixes, then return `fixed` so the
        workflow runs `ce-code-review` again. If a finding cannot be resolved
        safely, report an action failure instead of claiming it is fixed.

        End your answer with a single JSON object and nothing after it:
          {"output": "fixed", "data": {"fixed": <count>}}
    outputs:
      - label: fixed
        description: findings are fixed; run automated review again.
    transitions:
      fixed: code_review
    timeout: 1h

  publish_work:
    description: >
      Publish the implementation: open a PR for a new branch or update the
      existing PR after an automated review cycle.
    action:
      type: agent
      prompt: |
        The change has passed automated review. Check whether the current
        branch already has an open pull request. If it does not, run
        `ce-commit-push-pr` to commit,
        push and open one with a value-first description. If it does, commit
        and push the reviewed updates to that existing PR; do not create a
        duplicate. Follow the repository's commit conventions and never push
        to the default branch.

        End your answer with a single JSON object and nothing after it:
          {"output": "published", "data": {"pr_url": "<url>"}, "variables": {"pr_url": "<url>"}}
        If commit or push fails, report an action failure.
    outputs:
      - label: published
        description: the branch is pushed and the new or existing PR is current.
    transitions:
      published: implementation_review
    timeout: 30m

  publish_learning:
    description: >
      Push the learning written after human review to the existing pull
      request, then ask for a final human review of the updated PR.
    action:
      type: agent
      prompt: |
        The pull request was already reviewed and approved by a person.
        `ce-compound` has now written durable learning to `docs/solutions/`.
        Commit and push that learning to the existing pull request; do not
        create a new PR. Follow repository commit conventions and never push
        to the default branch.

        End your answer with a single JSON object and nothing after it:
          {"output": "updated", "data": {"pr_url": "<url>"}}
        If commit or push fails, report an action failure.
    outputs:
      - label: updated
        description: the learning is pushed to the existing pull request.
    transitions:
      updated: learning_review
    timeout: 30m

  learning_review:
    description: >
      HUMAN GATE — final review after the learning document was pushed to the
      already reviewed pull request.
    action:
      type: human
      message: >
        The learning document has been added to the approved pull request and
        pushed. Review the updated PR. Approve it, request changes, or stop.
      inputs:
        - name: learning_review_decision
          type: select
          required: true
          options:
            - approve
            - revise
            - abandon
        - name: revision_notes
          type: text
          required: true
          description: What to change, or "none" if approving or abandoning.
    outputs:
      - label: approve
        description: the updated pull request is approved; finish the workflow.
      - label: revise
        description: send the updated pull request back for changes.
      - label: abandon
        description: stop the pipeline here.
    transitions:
      approve: finished
      revise: work_revision
      abandon: cancelled

  compound:
    description: >
      ce-compound — the step that makes the engineering compound: write down
      what was learned so the next run starts further along.
    action:
      type: agent
      prompt: |
        Run the `ce-compound` skill over this piece of work. Write the durable
        learning to `docs/solutions/` with the frontmatter the skill
        prescribes, so a future `ce-learnings-researcher` can find it: the
        problem, the root cause, what was tried, what worked, and the rule to
        follow next time. If nothing here was worth keeping, say so rather
        than padding the corpus.

        End your answer with a single JSON object and nothing after it:
          {"output": "<label>", "data": {"doc": "<repo-relative path or null>"}}
    outputs:
      - label: documented
        description: a learning document was written.
      - label: nothing_to_document
        description: this run taught nothing that is not already written down.
    transitions:
      documented: publish_learning
      nothing_to_document: finished
    timeout: 30m
    retry_policy:
      max_attempts: 2
      backoff: 30s

  # -------------------------------------------------------------------------
  # Terminals
  # -------------------------------------------------------------------------

  finished:
    description: Merged-ready work, reviewed, published and its learning written down.

  cancelled:
    description: A person stopped the pipeline.

terminal_states:
  finished: completed
  cancelled: cancelled
