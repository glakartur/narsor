name: compound-engineering
version: 1
description: >
  The compound engineering chain in five stages, from requirements to a merged
  merge request: requirements (ce-brainstorm, ce-doc-review), plan (ce-plan,
  ce-doc-review), implementation (ce-work, ce-simplify-code, ce-code-review,
  the repository checks), learning (ce-compound) and finalize. Each stage
  publishes to one Draft merge request, stops for a person, and then checks
  the feedback posted while the person was reading. Finalize takes the merge
  request out of Draft, approves it and merges it after a green pipeline, with
  glab on GitLab.

inputs:
  - name: feature_description
    type: text
    required: true
    description: The idea, problem or feature to explore, plan and ship.
  - name: target_repo
    type: repository
    required: true
    description: The repository the work happens in.

display:
  title: "{{ inputs.feature_description }}"
  links:
    - label: PR
      text: "{{ context.variables.pr_url }}"
      url: "{{ context.variables.pr_url }}"

globals:
  timeout: 4h
  workspace:
    type: git
    repository: "{{ inputs.target_repo }}"

states:
  # -------------------------------------------------------------------------
  # 1. Requirements — WHAT to build
  # -------------------------------------------------------------------------

  brainstorm:
    description: >
      ce-brainstorm — explore the request with the person and write a
      right-sized requirements document. Also the author of every revision of
      that document.
    action:
      type: agent
      prompt: |
        Run the `ce-brainstorm` skill with these arguments:

        {{ inputs.feature_description }}

        When the direction is unclear, ask the person; do not guess the product direction.

        Requirements document from an earlier pass, to revise rather than rewrite (empty on the first pass): {{ artifacts.requirements_doc }}
        Why the plan step could not plan the requirements (empty when it could): {{ context.requirements_blocker }}
        Feedback from the requirements approval (may be empty): {{ context.requirements_feedback }}

        Set `requirements_blocker` to an empty text in your answer: the revised document answers it.
    variables:
      - name: requirements_blocker
        description: >-
          why the plan step could not plan the requirements. Set it to an empty
          text: the document you wrote answers it.
    artifacts:
      - name: requirements_doc
        description: repo-relative path of the requirements document you wrote or revised.
    choices:
      - label: requirements_drafted
        description: the requirements document is written.
        requires_artifacts: [requirements_doc]
    transitions:
      requirements_drafted: doc_review
    timeout: 45m

  doc_review:
    description: >
      ce-doc-review — persona agents read the requirements document and fix
      what they find. A person accepts the result before it is published.
    action:
      type: agent
      prompt: |
        Run the `ce-doc-review` skill with these arguments: mode:headless {{ artifacts.requirements_doc }}

        Apply the fixes the review supports. Summarise the review in `review_summary`.
    variables:
      - name: review_summary
        description: >-
          the number of findings by severity, what you fixed and what is left
          open.
    choices:
      - label: reviewed
        description: the document was reviewed and the findings recorded.
        requires_variables: [review_summary]
        requires_human_approval: true
    transitions:
      reviewed: publish_requirements
    timeout: 30m
    retry_policy:
      max_attempts: 2
      backoff: 30s

  publish_requirements:
    description: >
      Publish the reviewed requirements. The first publication opens the Draft
      merge request every later stage pushes to.
    action:
      type: agent
      prompt: |
        Run the `ce-commit-push-pr` skill with `mode:pipeline babysit:off`. This is a GitLab repository: the pull request is a merge request.
        If this branch has no open merge request, open one as a Draft against the repository's default branch. If it has one ({{ context.pr_url }}), push the reviewed requirements to it without rewriting its description.
        Report the merge request URL in `pr_url`.
    variables:
      - name: pr_url
        description: URL of the open merge request for this branch.
    choices:
      - label: published
        description: the reviewed requirements are on the merge request.
        requires_variables: [pr_url]
    transitions:
      published: approve_requirements
    timeout: 30m

  approve_requirements:
    description: >
      HUMAN GATE — is the scope right? Every later step is measured against
      the requirements; a wrong scope corrected here costs one conversation.
    action:
      type: human
      message: >
        Read the requirements document and its review on the merge request.
        Approve it, send it back to its author with a comment, or stop. A note
        given with an approval is carried into the plan.
      inputs:
        - name: requirements_decision
          type: select
          required: true
          options:
            - approve
            - revise
            - abandon
        - name: requirements_feedback
          type: text
          required: false
          description: >
            Required for revise — what the requirements get wrong. Optional
            for approve — what the plan must respect beyond the document.
    choices:
      - label: approve
        description: the scope is right; check the feedback and plan against it.
      - label: revise
        description: the author of the requirements revises them, with the comment.
        resume_comment_field: requirements_feedback
      - label: abandon
        description: stop the pipeline here.
    transitions:
      approve: check_requirements_feedback
      revise: brainstorm
      abandon: cancelled

  check_requirements_feedback:
    description: >
      Check the feedback posted on the merge request while the requirements
      waited for approval, and judge how large any fix was.
    action:
      type: agent
      prompt: |
        Run the `ce-resolve-pr-feedback` skill with `mode:pipeline {{ context.pr_url }}`. Process the feedback posted while the requirements waited for approval.
        If you pushed fixes, judge their size and say why in `reason`: a minor fix changes wording or detail and not what is built; a major fix changes scope or behaviour and needs another review.
    choices:
      - label: no_feedback
        description: no actionable feedback remains; plan against the approved requirements.
      - label: fixed_minor
        description: small fixes were pushed; publish them and ask for approval again.
      - label: fixed_major
        description: fixes changed scope or behaviour; review the document again.
      - label: needs_human
        description: a feedback thread needs a decision by the person.
    transitions:
      no_feedback: plan
      fixed_minor: publish_requirements
      fixed_major: doc_review
      needs_human: approve_requirements
    timeout: 1h

  # -------------------------------------------------------------------------
  # 2. Plan — HOW to build it
  # -------------------------------------------------------------------------

  plan:
    description: >
      ce-plan — turn the approved requirements into an implementation plan.
      Also the author of every revision of the plan.
    action:
      type: agent
      prompt: |
        Run the `ce-plan` skill with these arguments: {{ artifacts.requirements_doc }}

        Your plan from an earlier pass, to revise rather than start over (empty on the first pass): {{ artifacts.plan_doc }}
        Note from the requirements approval (may be empty): {{ context.requirements_feedback }}
        Feedback on the plan (may be empty): {{ context.plan_feedback }}
        Why the implementation could not follow the plan (empty when it could): {{ context.plan_blocker }}

        If the requirements cannot be planned as written, choose `needs_requirements_revision` and put the contradiction or the missing decision in `requirements_blocker`. The requirements go back to their author.
        Set `plan_blocker` to an empty text in your answer, whatever you choose: this pass has taken it into account.
    variables:
      - name: requirements_blocker
        description: >-
          the contradiction or missing decision that keeps the requirements
          from being planned as written.
      - name: plan_blocker
        description: >-
          why the implementation could not follow the plan. Set it to an empty
          text: this pass has taken it into account.
    artifacts:
      - name: plan_doc
        description: repo-relative path of the plan you wrote or revised.
    choices:
      - label: plan_ready
        description: the plan is written and an implementer could start.
        requires_artifacts: [plan_doc]
      - label: needs_requirements_revision
        description: >-
          the approved requirements cannot be planned as written; their author
          revises them.
        requires_variables: [requirements_blocker]
    transitions:
      plan_ready: plan_review
      needs_requirements_revision: brainstorm
    timeout: 1h
    retry_policy:
      max_attempts: 2
      backoff: 1m

  plan_review:
    description: >
      ce-doc-review over the plan. A person accepts the result before it is
      published.
    action:
      type: agent
      prompt: |
        Run the `ce-doc-review` skill with these arguments: mode:headless {{ artifacts.plan_doc }}

        The plan implements these requirements: {{ artifacts.requirements_doc }}
        Apply the fixes the review supports. Summarise the review in `review_summary`.
    variables:
      - name: review_summary
        description: >-
          the number of findings by severity, what you fixed and what is left
          open.
    choices:
      - label: reviewed
        description: the plan was reviewed and the findings recorded.
        requires_variables: [review_summary]
        requires_human_approval: true
    transitions:
      reviewed: publish_plan
    timeout: 30m
    retry_policy:
      max_attempts: 2
      backoff: 30s

  publish_plan:
    description: Push the reviewed plan to the merge request.
    action:
      type: agent
      prompt: |
        Run the `ce-commit-push-pr` skill with `mode:pipeline babysit:off`. This is a GitLab repository: the pull request is a merge request.
        Push the reviewed plan to the open merge request of this branch ({{ context.pr_url }}) without rewriting its description. If the branch has none, open one as a Draft against the repository's default branch.
        Report the merge request URL in `pr_url`.
    variables:
      - name: pr_url
        description: URL of the open merge request for this branch.
    choices:
      - label: published
        description: the reviewed plan is on the merge request.
        requires_variables: [pr_url]
    transitions:
      published: approve_plan
    timeout: 30m

  approve_plan:
    description: >
      HUMAN GATE — the last point before code exists. A correction made here
      is free; the same correction made after the work is a rewrite.
    action:
      type: human
      message: >
        Read the plan and its review on the merge request. Approve it and the
        agent writes code; send the plan back to its author, send the
        requirements back to theirs, or stop.
      inputs:
        - name: plan_decision
          type: select
          required: true
          options:
            - approve
            - revise
            - revise_requirements
            - abandon
        - name: plan_feedback
          type: text
          required: false
          description: >
            Required for revise and revise_requirements — what is wrong.
            Optional for approve.
    choices:
      - label: approve
        description: the plan is right; check the feedback and start writing code.
      - label: revise
        description: the author of the plan revises it, with the comment.
        resume_comment_field: plan_feedback
      - label: revise_requirements
        description: the plan shows the requirements are wrong; their author revises them.
        resume_comment_field: plan_feedback
      - label: abandon
        description: stop before any code is written.
    transitions:
      approve: check_plan_feedback
      revise: plan
      revise_requirements: brainstorm
      abandon: cancelled

  check_plan_feedback:
    description: >
      Check the feedback posted on the merge request while the plan waited for
      approval, and judge how large any fix was.
    action:
      type: agent
      prompt: |
        Run the `ce-resolve-pr-feedback` skill with `mode:pipeline {{ context.pr_url }}`. Process the feedback posted while the plan waited for approval.
        If you pushed fixes, judge their size and say why in `reason`: a minor fix changes wording or detail and not what is built; a major fix changes the approach, the scope or the sequencing and needs another review.
    choices:
      - label: no_feedback
        description: no actionable feedback remains; implement the approved plan.
      - label: fixed_minor
        description: small fixes were pushed; publish them and ask for approval again.
      - label: fixed_major
        description: fixes changed the plan's substance; review the plan again.
      - label: needs_human
        description: a feedback thread needs a decision by the person.
    transitions:
      no_feedback: work
      fixed_minor: publish_plan
      fixed_major: plan_review
      needs_human: approve_plan
    timeout: 1h

  # -------------------------------------------------------------------------
  # 3. Implementation
  # -------------------------------------------------------------------------

  work:
    description: >
      ce-work — execute the approved plan, following existing patterns and
      keeping the tests green. The workflow owns review and publication.
    action:
      type: agent
      prompt: |
        Run the `ce-work` skill with these arguments: mode:return-to-caller {{ artifacts.plan_doc }}

        Run the plan's relevant checks before implementation and record their concise result as `test_baseline`. Preserve that baseline: do not repair pre-existing failures or investigate them as part of this plan.

        If the plan cannot be implemented as written, choose `needs_plan_revision` and put what blocks it in `plan_blocker`. The plan goes back to its author.
    variables:
      - name: test_baseline
        description: concise result of checks run before implementation, including pre-existing failures or “all passed”.
      - name: plan_blocker
        description: what in the plan cannot be implemented as written, and why.
    choices:
      - label: implemented
        description: the plan is implemented and the checks pass.
        requires_variables: [test_baseline]
      - label: needs_plan_revision
        description: the plan cannot be implemented as written; its author revises it.
        requires_variables: [plan_blocker]
    transitions:
      implemented: simplify
      needs_plan_revision: plan
    timeout: 2h

  simplify:
    description: >
      ce-simplify-code — refine what was just written for clarity, reuse and
      efficiency, without changing behaviour. Runs once, after the first
      implementation.
    action:
      type: agent
      prompt: |
        Run the `ce-simplify-code` skill.
    choices:
      - label: simplified
        description: simplifications were applied and the checks pass.
      - label: unchanged
        description: the code is already as simple as it should be.
    transitions:
      simplified: code_review
      unchanged: code_review
    timeout: 45m
    retry_policy:
      max_attempts: 2
      backoff: 1m

  code_review:
    description: >
      ce-code-review in report mode. Every change of code passes here before
      it is verified and published.
    action:
      type: agent
      prompt: |
        Run the `ce-code-review` skill with these arguments: mode:agent plan:{{ artifacts.plan_doc }}
    choices:
      - label: clean
        description: no actionable findings survived the confidence gate.
      - label: findings
        description: findings need fixes before the code is verified and published.
    transitions:
      clean: verify_work
      findings: fix_findings
    timeout: 1h
    max_entries: 10
    retry_policy:
      max_attempts: 2
      backoff: 1m

  fix_findings:
    description: Address the code-review findings; the review then runs again.
    action:
      type: agent
      prompt: |
        Fix these findings from the code review. Do not perform an independent review of the diff; only address the listed actionable work.

        {{ steps.code_review.reply }}

        Test baseline captured before implementation:
        {{ context.test_baseline }}
        Preserve this baseline: do not repair pre-existing failures or investigate them as part of this plan.
    choices:
      - label: fixed
        description: the findings are addressed; review the code again.
    transitions:
      fixed: code_review
    timeout: 1h

  verify_work:
    description: >
      Run the repository's optional formatting, build and test checks before
      publishing code. Only a missing script skips the checks.
    action:
      type: script
      command: bash
      args:
        - -c
        - |
          if [ ! -e scripts/verify.sh ] && [ ! -L scripts/verify.sh ]; then
            exit 2
          fi
          if [ ! -f scripts/verify.sh ]; then
            echo 'scripts/verify.sh exists but is not a regular file' >&2
            exit 1
          fi
          printf '[verify_work] repository checks\n'
          bash scripts/verify.sh
          result=$?
          printf '\n[verify_work] finished with exit code %s\n' "$result"
          if [ "$result" -eq 0 ]; then
            exit 0
          fi
          exit 1
      env:
        CI: "true"
      exit_codes:
        0: passed
        1: failed
        2: skipped
    choices:
      - label: passed
        description: the repository's formatting, build and test checks passed.
      - label: failed
        description: an existing verification script failed and needs repair.
      - label: skipped
        description: the repository has no scripts/verify.sh.
    transitions:
      passed: publish_work
      failed: repair_verification
      skipped: publish_work
    timeout: 2h

  repair_verification:
    description: Fix a failed repository check; the fix goes through review again.
    action:
      type: agent
      prompt: |
        The repository's `scripts/verify.sh` failed in `verify_work`. Diagnose the failure from this captured output; do not rerun the complete script in this step. Fix the cause. The workflow reviews the fix and reruns the complete script before publishing.

        Captured stdout from verify_work:
        {{ steps.verify_work.stdout }}

        Captured stderr from verify_work:
        {{ steps.verify_work.stderr }}

        Approved plan: {{ artifacts.plan_doc }}
        Test baseline before implementation: {{ context.test_baseline }}
        Preserve that baseline: do not repair pre-existing failures unrelated to this work. If the script or environment is broken independently of this change, report the blocker instead of removing or bypassing the check.
    choices:
      - label: repaired
        description: the check failure was repaired; review the fix.
    transitions:
      repaired: code_review
    timeout: 1h
    max_entries: 5

  publish_work:
    description: Push the reviewed and verified implementation to the merge request.
    action:
      type: agent
      prompt: |
        Run the `ce-commit-push-pr` skill with `mode:pipeline babysit:off`. This is a GitLab repository: the pull request is a merge request.
        Push the reviewed implementation to the open merge request of this branch ({{ context.pr_url }}) without rewriting its description. If the branch has none, open one as a Draft against the repository's default branch.
        Report the merge request URL in `pr_url`.
    variables:
      - name: pr_url
        description: URL of the open merge request for this branch.
    choices:
      - label: published
        description: the reviewed implementation is on the merge request.
        requires_variables: [pr_url]
    transitions:
      published: approve_work
    timeout: 30m

  approve_work:
    description: >
      HUMAN GATE — the implementation is on the merge request. The person
      reviews it and approves it, asks for changes, sends the plan back, or
      stops.
    action:
      type: human
      message: >
        The implementation has been pushed to the merge request. Review it,
        including feedback from its reviewers. Approve it, ask for changes,
        send the plan back to its author, or stop.
      inputs:
        - name: work_decision
          type: select
          required: true
          options:
            - approve
            - revise
            - revise_plan
            - abandon
        - name: work_feedback
          type: text
          required: false
          description: >
            Required for revise and revise_plan — what to change. Optional for
            approve.
    choices:
      - label: approve
        description: the implementation is right; check the feedback and capture the learning.
      - label: revise
        description: make the changes named in the comment; they go through review again.
        resume_comment_field: work_feedback
      - label: revise_plan
        description: the implementation shows the plan is wrong; its author revises it.
        resume_comment_field: work_feedback
      - label: abandon
        description: stop the pipeline here.
    transitions:
      approve: check_work_feedback
      revise: work_revision
      revise_plan: plan
      abandon: cancelled

  work_revision:
    description: >
      Make the changes the person asked for at the implementation gate. They
      go through code review, verification and publication again, without a
      second simplify.
    action:
      type: agent
      prompt: |
        Run the `ce-work` skill with these arguments: mode:return-to-caller {{ artifacts.plan_doc }}

        Make the changes requested in review:
        {{ context.work_feedback }}

        Test baseline captured before implementation:
        {{ context.test_baseline }}
        Preserve this baseline: do not repair pre-existing failures or investigate them as part of this plan.
    choices:
      - label: revised
        description: the requested changes are made and the checks pass.
    transitions:
      revised: code_review
    timeout: 1h

  check_work_feedback:
    description: >
      Check the feedback posted on the merge request while the implementation
      waited for approval.
    action:
      type: agent
      prompt: |
        Run the `ce-resolve-pr-feedback` skill with `mode:pipeline {{ context.pr_url }}`. Process the feedback posted while the implementation waited for approval. Fixes you make go through code review, verification and approval again.
    choices:
      - label: no_feedback
        description: no actionable feedback remains; capture the learning.
      - label: fixed
        description: code changed to address feedback; review it again.
      - label: needs_human
        description: a feedback thread needs a decision by the person.
    transitions:
      no_feedback: compound
      fixed: code_review
      needs_human: approve_work
    timeout: 1h

  # -------------------------------------------------------------------------
  # 4. Learning
  # -------------------------------------------------------------------------

  compound:
    description: >
      ce-compound — the step that makes the engineering compound: write down
      what was learned so the next run starts further along.
    action:
      type: agent
      prompt: |
        Run the `ce-compound` skill with these arguments: mode:headless

        Your learning document from an earlier pass, to update rather than duplicate (empty if there is none): {{ artifacts.learning_doc }}
        Feedback on the learning (may be empty): {{ context.learning_feedback }}
    artifacts:
      - name: learning_doc
        description: repo-relative path of the learning document you wrote or updated.
    choices:
      - label: documented
        description: a learning document was written or updated.
        requires_artifacts: [learning_doc]
      - label: nothing_to_document
        description: this run taught nothing that is not already written down.
    transitions:
      documented: publish_learning
      nothing_to_document: finalize
    timeout: 30m
    retry_policy:
      max_attempts: 2
      backoff: 30s

  publish_learning:
    description: Push the learning document to the merge request.
    action:
      type: agent
      prompt: |
        Run the `ce-commit-push-pr` skill with `mode:pipeline babysit:off`. This is a GitLab repository: the pull request is a merge request.
        Push the learning document to the open merge request of this branch ({{ context.pr_url }}) without rewriting its description.
        Report the merge request URL in `pr_url`.
    variables:
      - name: pr_url
        description: URL of the open merge request for this branch.
    choices:
      - label: published
        description: the learning document is on the merge request.
        requires_variables: [pr_url]
    transitions:
      published: approve_learning
    timeout: 30m

  approve_learning:
    description: >
      HUMAN GATE — is the learning worth keeping? The implementation is
      already approved, so this gate cannot stop the pipeline: it keeps,
      revises or drops the learning.
    action:
      type: human
      message: >
        The learning document has been pushed to the merge request. Approve
        it, send it back to its author with a comment, or drop it.
      inputs:
        - name: learning_decision
          type: select
          required: true
          options:
            - approve
            - revise
            - drop
        - name: learning_feedback
          type: text
          required: false
          description: Required for revise — what to change. Optional otherwise.
    choices:
      - label: approve
        description: keep the learning; check the feedback and finalize.
      - label: revise
        description: the author of the learning revises it, with the comment.
        resume_comment_field: learning_feedback
      - label: drop
        description: remove the learning document and finalize without it.
    transitions:
      approve: check_learning_feedback
      revise: compound
      drop: drop_learning

  drop_learning:
    description: Remove the dropped learning document from the merge request.
    action:
      type: agent
      prompt: |
        The person dropped the learning document {{ artifacts.learning_doc }}. Delete it, then run the `ce-commit-push-pr` skill with `mode:pipeline babysit:off` to push the removal to the open merge request of this branch ({{ context.pr_url }}) without rewriting its description.
    choices:
      - label: dropped
        description: the learning document is removed from the merge request.
    transitions:
      dropped: finalize
    timeout: 30m

  check_learning_feedback:
    description: >
      Check the feedback posted on the merge request while the learning
      waited for approval.
    action:
      type: agent
      prompt: |
        Run the `ce-resolve-pr-feedback` skill with `mode:pipeline {{ context.pr_url }}`. Process the feedback posted while the learning waited for approval.
    choices:
      - label: no_feedback
        description: no actionable feedback remains; finalize.
      - label: fixed
        description: the learning changed to address feedback; publish it and ask again.
      - label: needs_human
        description: a feedback thread needs a decision by the person.
    transitions:
      no_feedback: finalize
      fixed: publish_learning
      needs_human: approve_learning
    timeout: 1h

  # -------------------------------------------------------------------------
  # 5. Finalize — merge on GitLab
  # -------------------------------------------------------------------------

  finalize:
    description: >
      Take the merge request out of Draft, approve it and merge it when its
      pipeline succeeds, then wait up to an hour for the result. Any result
      other than a merge cancels auto-merge and restores the Draft, so the
      merge request never merges without a person.
    action:
      type: script
      command: bash
      args:
        - -c
        - |
          wait_limit=${FINALIZE_WAIT_SECS:-3600}
          poll_every=${FINALIZE_POLL_SECS:-30}
          state=unknown target=unknown pipeline=unknown merge_status=unknown project_id=
          log() { printf '[finalize] %s\n' "$*" >&2; }
          answer() {
            reason=$(printf '%s' "$2" | tr -d '\000-\037' | sed 's/\\/\\\\/g; s/"/\\"/g')
            printf '{"choice":"%s","reason":"%s"}\n' "$1" "$reason"
            exit 0
          }
          case "$MR_URL" in
            http*://*/-/merge_requests/*) ;;
            *) answer blocked "context.pr_url is not a GitLab merge request URL: '$MR_URL'" ;;
          esac
          repo=${MR_URL%%/-/merge_requests/*}
          host=${repo#*://}
          host=${host%%/*}
          iid=${MR_URL##*/-/merge_requests/}
          iid=${iid%%[/?#]*}
          case "$iid" in
            ''|*[!0-9]*) answer blocked "no merge request number in '$MR_URL'" ;;
          esac
          command -v glab >/dev/null 2>&1 || answer blocked "glab is not installed where the step runs"
          read_mr() {
            line=$(glab mr view "$iid" -R "$repo" -F json --jq '[.state, .target_branch, (.has_conflicts // false), (.detailed_merge_status // "unknown"), (.head_pipeline.status // "none"), .project_id] | map(tostring) | join("|")') || return 1
            IFS='|' read -r state target conflicts merge_status pipeline project_id <<< "$line"
          }
          disarm() {
            if [ -n "$project_id" ]; then
              glab api --hostname "$host" -X POST "projects/$project_id/merge_requests/$iid/cancel_merge_when_pipeline_succeeds" >&2 || log "auto-merge was not cancelled"
            fi
            glab mr update "$iid" -R "$repo" --draft >&2 || log "the Draft flag was not restored"
          }
          stop_unmerged() {
            disarm
            if read_mr && [ "$state" = merged ]; then
              answer merged "!$iid merged into $target while auto-merge was being cancelled"
            fi
            answer "$1" "$2"
          }
          read_mr || answer blocked "glab could not read merge request !$iid"
          if [ "$state" = merged ]; then
            answer merged "!$iid is already merged into $target"
          fi
          if [ "$state" != opened ]; then
            answer blocked "!$iid is $state, not open"
          fi
          log "merging !$iid into $target"
          glab mr update "$iid" -R "$repo" --ready >&2 || answer blocked "glab could not take !$iid out of Draft"
          if ! approval=$(glab mr approve "$iid" -R "$repo" 2>&1); then
            case "$approval" in
              *[Aa]lready*) log "!$iid is already approved" ;;
              *) stop_unmerged blocked "glab could not approve !$iid: $approval" ;;
            esac
          fi
          glab mr merge "$iid" -R "$repo" --auto-merge --yes >&2 || stop_unmerged blocked "glab could not set auto-merge on !$iid"
          deadline=$(( $(date +%s) + wait_limit ))
          while :; do
            if read_mr; then
              case "$state" in
                merged) answer merged "!$iid merged into $target" ;;
                closed) stop_unmerged blocked "!$iid was closed before it merged" ;;
              esac
              if [ "$conflicts" = true ] || [ "$merge_status" = conflict ]; then
                stop_unmerged conflict "!$iid conflicts with $target"
              fi
              case "$pipeline" in
                failed|canceled) stop_unmerged pipeline_failed "the pipeline of !$iid ended $pipeline" ;;
              esac
            else
              log "glab could not read !$iid; trying again"
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              stop_unmerged blocked "!$iid was not merged within $wait_limit s (pipeline: $pipeline, merge status: $merge_status)"
            fi
            sleep "$poll_every"
          done
      env:
        MR_URL: "{{ context.pr_url }}"
    choices:
      - label: merged
        description: the merge request is merged into its target branch.
      - label: pipeline_failed
        description: the pipeline failed; auto-merge is cancelled and the code needs a repair.
      - label: conflict
        description: the merge request conflicts with its target branch and needs a repair.
      - label: blocked
        description: something else stopped the merge; auto-merge is cancelled and a person decides.
      - label: timeout
        description: the step outlived its time limit and was stopped before it could cancel auto-merge.
    transitions:
      merged: finished
      pipeline_failed: repair_merge
      conflict: repair_merge
      blocked: finalize_blocked
      timeout: disarm_merge
    timeout: 70m

  repair_merge:
    description: >
      Fix what kept the merge request from merging — a failed pipeline or a
      conflict. The fix goes through review, verification and approval again.
    action:
      type: agent
      prompt: |
        Finalize could not merge {{ context.pr_url }}. Its answer, with the reason:
        {{ steps.finalize.stdout }}

        Its log:
        {{ steps.finalize.stderr }}

        Find the cause — the failed pipeline jobs with `glab ci`, or the conflict with the target branch — and fix it in this branch. Do not push: the workflow reviews, verifies and publishes the fix.
        Approved plan: {{ artifacts.plan_doc }}
        Test baseline before implementation: {{ context.test_baseline }}
    choices:
      - label: repaired
        description: the cause is fixed; review the fix.
    transitions:
      repaired: code_review
    timeout: 1h
    max_entries: 3

  disarm_merge:
    description: >
      Clean up after a finalize the engine stopped at its time limit: cancel
      auto-merge, restore the Draft and read the merge request once more.
    action:
      type: script
      command: bash
      args:
        - -c
        - |
          state=unknown target=unknown project_id=
          log() { printf '[disarm_merge] %s\n' "$*" >&2; }
          answer() {
            reason=$(printf '%s' "$2" | tr -d '\000-\037' | sed 's/\\/\\\\/g; s/"/\\"/g')
            printf '{"choice":"%s","reason":"%s"}\n' "$1" "$reason"
            exit 0
          }
          repo=${MR_URL%%/-/merge_requests/*}
          host=${repo#*://}
          host=${host%%/*}
          iid=${MR_URL##*/-/merge_requests/}
          iid=${iid%%[/?#]*}
          read_mr() {
            line=$(glab mr view "$iid" -R "$repo" -F json --jq '[.state, .target_branch, .project_id] | map(tostring) | join("|")') || return 1
            IFS='|' read -r state target project_id <<< "$line"
          }
          read_mr || log "glab could not read !$iid"
          if [ "$state" = merged ]; then
            answer merged "!$iid merged into $target before finalize was stopped"
          fi
          if [ -n "$project_id" ]; then
            glab api --hostname "$host" -X POST "projects/$project_id/merge_requests/$iid/cancel_merge_when_pipeline_succeeds" >&2 || log "auto-merge was not cancelled"
          fi
          glab mr update "$iid" -R "$repo" --draft >&2 || log "the Draft flag was not restored"
          if read_mr && [ "$state" = merged ]; then
            answer merged "!$iid merged into $target while auto-merge was being cancelled"
          fi
          answer disarmed "finalize hit its time limit; auto-merge on !$iid is cancelled and the Draft flag restored (state: $state)"
      env:
        MR_URL: "{{ context.pr_url }}"
    choices:
      - label: merged
        description: the merge request merged before auto-merge could be cancelled.
      - label: disarmed
        description: auto-merge is cancelled and the Draft flag restored; a person decides.
    transitions:
      merged: finished
      disarmed: finalize_blocked
    timeout: 10m

  finalize_blocked:
    description: >
      HUMAN GATE — finalize could not merge. Its reason is shown with the
      request. The merge request is back in Draft with auto-merge cancelled.
    action:
      type: human
      message: >
        Finalize could not merge the merge request; its reason is shown above.
        Fix what blocks it on GitLab and retry, or finish without merging.
      inputs:
        - name: finalize_decision
          type: select
          required: true
          options:
            - retry
            - finish_unmerged
    choices:
      - label: retry
        description: run finalize again.
      - label: finish_unmerged
        description: end the pipeline without merging; the merge request stays open as a Draft.
    transitions:
      retry: finalize
      finish_unmerged: not_merged

  # -------------------------------------------------------------------------
  # Terminals
  # -------------------------------------------------------------------------

  finished:
    description: The merge request is merged, with its requirements, plan, code and learning.

  cancelled:
    description: A person stopped the pipeline.

  not_merged:
    description: A person ended the pipeline without merging; the work never reached the target branch.

terminal_states:
  finished: completed
  cancelled: cancelled
  not_merged: cancelled
