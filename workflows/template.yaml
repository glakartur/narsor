schema: v2
name: template
version: 1
description: A safe, runnable tour of Narsor workflow features.

inputs:
  - name: example_text
    type: text
    required: true
    description: Text shown at the human decision gate.

globals:
  timeout: 2m
  retry_policy:
    max_attempts: 2
    backoff: 0s

# Model and effort per agent step (not used below, which has no agent step).
# A model is a tier — small, medium, large, max — never a model name: each
# harness maps the tier to its own model. Efforts are low, medium, high, max.
#
#   globals:
#     default_model: medium                       # for a step that names none
#     default_effort: medium
#     ceiling: { model: large, effort: high }     # the most the conductor or an escalation may set
#   states:
#     plan:
#       action: { type: agent, plan: true, prompt: "..." }
#     work:
#       action:
#         type: agent
#         model: small                            # a step's own value wins
#         ceiling: { effort: max }                # and so does its own ceiling, field by field
#         prompt: "..."
#
# A step with a ceiling needs a model and an effort, and the ceiling needs both too,
# whether the step or `globals` gives them.

states:
  demonstrate:
    description: Prints a structured result without changing files or calling external services.
    timeout: 10s
    action:
      type: script
      command: /usr/bin/printf
      args:
        - '{"reason":"The no-op script completed.","variables":{"example_value":"sample"},"artifacts":{"example_file":"template-example.txt"}}\n'
    variables:
      - name: example_value
        description: A sample value carried into the next state.
    artifacts:
      - name: example_file
        description: A sample artifact path; this workflow does not create the file.
    exit:
      description: The sample result and artifact reference are available.
      requires_variables: [example_value]
      requires_artifacts: [example_file]
      next: review

  review:
    description: Shows workflow inputs and script outputs, then waits for a person to choose a route.
    action:
      type: decision
      by: human
      message: |
        Example input: {{ inputs.example_text }}
        Script variable: {{ context.example_value }}
        Artifact path metadata: {{ artifacts.example_file }}
    variables:
      - name: comment
        type: text
        description: Optional note; it is recorded with this decision.
      - name: outcome
        source: workflow
        options: [finished, cancelled]
        description: How the demonstration ended; only the chosen route writes it.
    choices:
      finish:
        description: Finish the demonstration successfully.
        set: { outcome: finished }
        next: completed
      cancel:
        description: End the demonstration as cancelled.
        set: { outcome: cancelled }
        next: cancelled

  completed:
    description: The demonstration completed.

  cancelled:
    description: The demonstration was cancelled by the person.

terminal_states:
  completed: completed
  cancelled: cancelled
