name: open-mercato-sdlc
version: 1
description: >
  The Open Mercato software delivery process as a runnable pipeline: Discovery,
  Intake, Triage, Claim, Design, Implement, PR, the review loop, QA, Merge and
  post-merge housekeeping, driven by the om-* skills. The human gates are the
  ones SDLC.md names itself — the ticket-level Definition of Ready that only a
  human can supply, the design contract for a user-facing change, the QA
  sign-off that a person owns, the merge that re-checks every gate, and the
  `blocked` / `do-not-merge` labels that only humans set and clear.

inputs:
  - name: ticket_id
    type: string
    required: true
    description: The tracker id of the ticket, or the brief this run files one for.
  - name: task_brief
    type: string
    required: true
    description: What the work is, in one or two sentences.
  - name: target_repo
    type: repository
    required: true
    description: The repository the work happens in.
  - name: validation_command
    type: string
    required: false
    default: scripts/lint.sh
    description: >
      The first command of the validation gate, run with `bash`. The gate's
      full command list lives in `.ai/agentic.config.json`; this is the entry
      point the pipeline shells out to.

globals:
  timeout: 6h
  workspace:
    type: git
    repository: "{{ inputs.target_repo }}"
    ref: main

states:
  # -------------------------------------------------------------------------
  # Discovery and Intake
  # -------------------------------------------------------------------------

  discover:
    description: >
      Discovery — om-discover establishes the product context, om-brainstorm
      turns the idea into a routing decision and a brief.
    action:
      type: agent
      harness: claude-code
      prompt: |
        Run the `om-discover` and `om-brainstorm` skills for ticket
        {{ inputs.ticket_id }}:

        {{ inputs.task_brief }}

        Read `.ai/specs/product-brief.md` if it exists — its Non-goals,
        Business rules and Decisions tables are a protected contract; quote
        the id of anything this work touches. Weigh the alternatives,
        including building nothing, and end in a routing decision.

        End your answer with a single JSON object and nothing after it:
          {"output": "<label>", "data": {"brief": "<repo-relative path or null>"}}
        Use exactly one of these labels:
          - "routed" — the work is worth continuing and a brief exists.
          - "no_action" — the right answer is to build nothing.
    outputs:
      - routed
      - no_action
    transitions:
      routed: intake
      no_action: closed_no_action
    timeout: 45m
    retry_policy:
      max_attempts: 2
      backoff: 30s

  intake:
    description: >
      Intake — om-prepare-issue files the ticket with SDLC labels and the
      ready sections; om-auto-manage-issues reports what an existing ticket
      still lacks.
    action:
      type: agent
      harness: claude-code
      prompt: |
        Run `om-prepare-issue` for ticket {{ inputs.ticket_id }}, or
        `om-auto-manage-issues` if the ticket already exists. File or update it
        with the SDLC sections and labels: one category label, one priority and
        one risk label inferred by the SDLC rules, and the QA meta label the
        change calls for. Record READY_STATUS against the Definition of Ready
        and post a not-ready comment naming exactly what is missing. Author no
        code.

        End your answer with a single JSON object and nothing after it:
          {"output": "<label>", "data": {"ready_status": "<READY|NOT_READY>", "gaps": []}}
        Use exactly one of these labels:
          - "ready" — every Definition of Ready item is on the ticket or in a
            spec it links.
          - "gaps_found" — items are missing; they are named on the ticket.
    outputs:
      - ready
      - gaps_found
    transitions:
      ready: confirm_readiness
      gaps_found: confirm_readiness
    timeout: 30m
    retry_policy:
      max_attempts: 2
      backoff: 30s

  confirm_readiness:
    description: >
      HUMAN GATE — the ticket-level Definition of Ready. SDLC.md is explicit
      that only a human can supply these: the problem and who has it, the
      expected outcome and how it is checked, what is out of scope, every
      blocking question answered, and any autonomous assumption confirmed. A
      spec can supply the second tier; it can never supply this one. A
      maintainer may also waive an item by saying so on the ticket.
    action:
      type: human
      message: >
        Confirm the ticket-level Definition of Ready for this ticket: the
        problem and who has it, the expected outcome and how it will be
        checked, what is out of scope, no blocking question left unanswered,
        and every autonomous assumption confirmed. Confirm it, waive an item as
        maintainer, send it back for the gaps to be filled, or stop.
      inputs:
        - name: readiness_decision
          type: select
          required: true
          options:
            - confirmed
            - waived
            - not_ready
            - abandon
        - name: readiness_notes
          type: text
          required: true
          description: >
            The ticket-level answers, or the item you are waiving and why, or
            what is still missing.
    outputs:
      - confirmed
      - waived
      - not_ready
      - abandon
    transitions:
      confirmed: triage
      waived: triage
      not_ready: intake
      abandon: cancelled

  triage:
    description: >
      Triage — om-verify-in-repo confirms the issue is real, still unfixed on
      main, and not already claimed or covered by an open PR. Read-only.
    action:
      type: agent
      harness: claude-code
      prompt: |
        Run the `om-verify-in-repo` skill for ticket {{ inputs.ticket_id }}.
        Reproduce the problem against `main`, check no open PR already covers
        it, and check no agent holds a claim on it. Read-only: change nothing.

        The reviewer's ticket-level answers are:

        {{ context.readiness_notes }}

        End your answer with a single JSON object and nothing after it:
          {"output": "<label>", "data": {"evidence": "<what you observed>"}}
        Use exactly one of these labels:
          - "actionable" — real, unfixed and unclaimed.
          - "no_action" — not reproducible, already fixed, or out of scope.
          - "already_claimed" — another agent or person holds the claim.
    outputs:
      - actionable
      - no_action
      - already_claimed
    transitions:
      actionable: claim
      no_action: closed_no_action
      already_claimed: closed_no_action
    timeout: 45m
    retry_policy:
      max_attempts: 2
      backoff: 30s

  claim:
    description: >
      Claim — the three-signal claim protocol, so concurrent agents back off.
    action:
      type: agent
      harness: claude-code
      prompt: |
        Claim ticket {{ inputs.ticket_id }} with all three signals the claim
        protocol requires: assign yourself, add the `in-progress` label, and
        post a claim comment saying what you are about to do. If you find an
        existing claim, back off instead of colliding.

        End your answer with a single JSON object and nothing after it:
          {"output": "<label>", "data": {"claimed_by": "<handle>"}}
        Use exactly one of these labels:
          - "claimed" — all three signals are on the ticket.
          - "claim_lost" — someone else claimed it first; back off.
    outputs:
      - claimed
      - claim_lost
    transitions:
      claimed: assess_surface
      claim_lost: closed_no_action
    timeout: 15m

  # -------------------------------------------------------------------------
  # Design — only for a user-facing change
  # -------------------------------------------------------------------------

  assess_surface:
    description: >
      Decide whether the Design stage applies: "a ticket that touches no UI
      skips this stage".
    action:
      type: agent
      harness: claude-code
      prompt: |
        Decide whether this change is user-facing. Read the ticket and the
        code it will touch: does it change a screen, a flow, or anything a
        user sees or operates? Do not start implementing.

        End your answer with a single JSON object and nothing after it:
          {"output": "<label>", "data": {"reason": "<one sentence>"}}
        Use exactly one of these labels:
          - "user_facing" — the Design stage applies.
          - "not_user_facing" — the Design stage is skipped.
    outputs:
      - user_facing
      - not_user_facing
    transitions:
      user_facing: shape_design
      not_user_facing: implement
    timeout: 20m
    retry_policy:
      max_attempts: 2
      backoff: 30s

  shape_design:
    description: >
      Design — om-ux-shape settles the flow and its states before the code
      exists.
    action:
      type: agent
      harness: claude-code
      prompt: |
        Run the `om-ux-shape` skill for ticket {{ inputs.ticket_id }}. Settle
        the flow and every state of it before any code exists: what the screen
        does when empty, while loading, in error, and without permission, plus
        long content and a narrow viewport — and what the change deliberately
        does not do. Record the design contract where the repository keeps it
        (`.uxproof/` when it has one). Write no implementation code.

        End your answer with a single JSON object and nothing after it:
          {"output": "<label>", "data": {"states_covered": []}}
        Use exactly one of these labels:
          - "shaped" — the flow and its states are written down.
          - "shaping_blocked" — the flow cannot be settled from what exists.
    outputs:
      - shaped
      - shaping_blocked
    transitions:
      shaped: approve_design
      shaping_blocked: failed
    timeout: 1h
    retry_policy:
      max_attempts: 2
      backoff: 1m

  approve_design:
    description: >
      HUMAN GATE — for a user-facing change the flow and its states are
      settled before the code exists. The Designer owns that contract, and QA
      later fails the change against it, so it is signed off here rather than
      discovered in review.
    action:
      type: human
      message: >
        Read the shaped flow and its state matrix (default, empty, loading,
        error, no-permission, long content, narrow viewport). Approve the
        design contract, send it back to be reshaped, or stop. QA will test
        the implementation against exactly this.
      inputs:
        - name: design_decision
          type: select
          required: true
          options:
            - approved
            - reshape
            - abandon
        - name: design_notes
          type: text
          required: false
          description: What the flow still gets wrong, if anything.
    outputs:
      - approved
      - reshape
      - abandon
    transitions:
      approved: implement
      reshape: shape_design
      abandon: cancelled

  # -------------------------------------------------------------------------
  # Implement and the validation gate
  # -------------------------------------------------------------------------

  implement:
    description: >
      Implement — om-root-cause locates the minimal change surface, om-fix (or
      om-auto-create-pr) makes the change with regression tests.
    action:
      type: agent
      harness: claude-code
      prompt: |
        Run `om-root-cause` read-only to locate the minimal change surface for
        ticket {{ inputs.ticket_id }}, then implement the change with
        `om-fix`. Add the regression test that would have caught this. Nothing
        in the diff may contradict a Non-goal, Business rule or Decision of
        `.ai/specs/product-brief.md` without a superseding entry in the same
        change.

        End your answer with a single JSON object and nothing after it:
          {"output": "<label>", "data": {"files_changed": <count>}}
        Use exactly one of these labels:
          - "implemented" — the change is complete with its tests.
          - "blocked" — the work cannot proceed without a human clearing
            something; say what in `data.reason`.
    outputs:
      - implemented
      - blocked
    transitions:
      implemented: validation_gate
      blocked: blocked_gate
    timeout: 3h

  validation_gate:
    description: >
      The validation gate — every PR passes it before review sign-off. Any
      non-zero exit fails the gate and blocks the PR.
    action:
      type: script
      command: bash
      args:
        - "{{ inputs.validation_command }}"
      env:
        CI: "true"
      exit_codes:
        0: green
        1: red
    outputs:
      - green
      - red
    transitions:
      green: open_pr
      red: implement

  # -------------------------------------------------------------------------
  # PR and the review loop
  # -------------------------------------------------------------------------

  open_pr:
    description: >
      PR — om-open-pr commits, pushes and opens a ready, fully labelled pull
      request against main.
    action:
      type: agent
      harness: claude-code
      prompt: |
        Run the `om-open-pr` skill. Open a ready (non-draft) pull request
        against `main` for ticket {{ inputs.ticket_id }}, carrying exactly one
        pipeline label (`review`), its category label, the QA meta label
        (`needs-qa` or `skip-qa`, never both), one priority and one risk label
        inherited from the issue, a run-summary comment, and a *Decisions
        touched* section in the body. Swap `in-progress` for `ci-monitoring`
        if you still owe the CI follow-up.

        End your answer with a single JSON object and nothing after it:
          {"output": "<label>", "data": {"pr": "<number>"}, "variables": {"pr_number": "<number>"}}
        Use exactly one of these labels:
          - "pr_opened" — the pull request is open and labelled.
          - "push_failed" — the push or the PR creation failed.
    outputs:
      - pr_opened
      - push_failed
    transitions:
      pr_opened: code_review
      push_failed: failed
    timeout: 30m

  code_review:
    description: >
      Review loop — om-auto-review-pr reads the diff against the
      om-code-review checklist and approves or requests changes. A failing
      required check is collected as a blocker finding and reported with the
      full review, never instead of it.
    action:
      type: agent
      harness: claude-code
      prompt: |
        Run the `om-auto-review-pr` skill over the open pull request, against
        the `om-code-review` checklist. Report every finding in one cycle,
        including a failing required check or a conflicted head as a blocker
        finding. Check the `risk-high` evidence table: a change to auth,
        sessions, data scoping, money, schema migrations or a shared contract
        surface blocks without the evidence SDLC.md requires unless a
        maintainer waived it on the PR. Move the pipeline label: approval →
        `merge-queue`, requested changes → `changes-requested`.

        End your answer with a single JSON object and nothing after it:
          {"output": "<label>", "data": {"findings": <count>, "blockers": <count>}}
        Use exactly one of these labels:
          - "approved" — an approving review is submitted.
          - "changes_requested" — findings were raised for the author.
          - "review_blocked" — the review cannot be produced at all.
    outputs:
      - approved
      - changes_requested
      - review_blocked
    transitions:
      approved: qa_routing
      changes_requested: address_feedback
      review_blocked: blocked_gate
    timeout: 1h
    retry_policy:
      max_attempts: 2
      backoff: 1m

  address_feedback:
    description: >
      Review loop — om-auto-continue-pr resumes the PR from its tracking plan
      and addresses the requested changes, then it goes back for re-review.
    action:
      type: agent
      harness: claude-code
      prompt: |
        Run the `om-auto-continue-pr` skill on the open pull request. Address
        every requested change, re-run the validation gate, push, reply on the
        threads, and move the pipeline label back to `review`. A push stales a
        pinned `qa-approved`: say so on the PR if one is in place.

        End your answer with a single JSON object and nothing after it:
          {"output": "<label>", "data": {"threads_addressed": <count>}}
        Use exactly one of these labels:
          - "updated" — the changes are pushed and the PR is back in `review`.
          - "blocked" — a requested change needs a human to clear something.
    outputs:
      - updated
      - blocked
    transitions:
      updated: code_review
      blocked: blocked_gate
    timeout: 2h

  # -------------------------------------------------------------------------
  # QA
  # -------------------------------------------------------------------------

  qa_routing:
    description: >
      Route by the QA meta label — `needs-qa` waits for QA, `skip-qa` is the
      explicit opt-out for docs-, dependency-, CI- and test-only changes.
    action:
      type: agent
      harness: claude-code
      prompt: |
        Read the pull request's QA meta label and confirm it against the
        change. `needs-qa` applies to UI changes, new features and other
        user-facing behaviour; `skip-qa` is the opt-out for docs-only,
        dependency-only, CI-only and test-only changes, and the two are never
        combined. Correct the label if the diff disagrees with it, and leave a
        comment saying why.

        End your answer with a single JSON object and nothing after it:
          {"output": "<label>", "data": {"qa_label": "<needs-qa|skip-qa>"}}
        Use exactly one of these labels:
          - "needs_qa" — the PR must be exercised before it merges.
          - "skip_qa" — the opt-out legitimately applies.
    outputs:
      - needs_qa
      - skip_qa
    transitions:
      needs_qa: qa_run
      skip_qa: premerge_check
    timeout: 20m
    retry_policy:
      max_attempts: 2
      backoff: 30s

  qa_run:
    description: >
      QA — om-prepare-test-env boots the app once, om-auto-qa-pr walks the
      change in a real browser and attaches screenshots and a pass/fail
      report. It touches no labels: automation never grants qa-approved.
    action:
      type: agent
      harness: claude-code
      prompt: |
        Run `om-prepare-test-env` to boot the app, then `om-auto-qa-pr` to walk
        the change in a real browser. Cover the whole state matrix — default,
        empty, loading, error, no-permission, long content, narrow viewport —
        and conformance to the design contract in `.uxproof/` when the
        repository has one; a missing state is a QA failure. Attach the
        screenshots and the pass/fail report as PR evidence with a
        `QA head: <sha>` line. Touch no labels: only a QA reviewer sets `qa`,
        and `qa-approved` is not yours to apply.

        End your answer with a single JSON object and nothing after it:
          {"output": "<label>", "data": {"scenarios": <count>, "qa_head": "<sha>"}}
        Use exactly one of these labels:
          - "evidence_ready" — the evidence is attached for a QA reviewer.
          - "qa_blocked" — the app could not be exercised at all.
    outputs:
      - evidence_ready
      - qa_blocked
    transitions:
      evidence_ready: qa_signoff
      qa_blocked: blocked_gate
    timeout: 2h

  qa_signoff:
    description: >
      HUMAN GATE — the one hard rule of this process. A PR carrying `needs-qa`
      must not merge until it also carries `qa-approved`, and SDLC.md is
      explicit that "manual means a person judges the result and owns
      `qa-approved`" and that only a QA reviewer sets the `qa` pipeline label.
      Automation may only reach `qa-approved` through the audited self-QA
      exception, never on a `risk-high` PR.
    action:
      type: human
      message: >
        QA evidence is attached to the pull request. As QA reviewer, judge it
        against the design contract and the state matrix and own the outcome:
        `qa_approved` applies `qa-approved` pinned to the tested head,
        `qa_failed` sends the change back to implementation. Do not sign off on
        a `risk-high` PR without being the QA reviewer, or a maintainer's
        stated exception.
      inputs:
        - name: qa_decision
          type: select
          required: true
          options:
            - qa_approved
            - qa_failed
            - abandon
        - name: qa_head
          type: text
          required: true
          description: >
            The commit sha you tested — it becomes the `QA head:` line that
            pins the approval.
        - name: qa_notes
          type: text
          required: false
          description: The scenario exercised, the environment, what failed.
    outputs:
      - qa_approved
      - qa_failed
      - abandon
    transitions:
      qa_approved: premerge_check
      qa_failed: implement
      abandon: cancelled

  # -------------------------------------------------------------------------
  # Merge and housekeeping
  # -------------------------------------------------------------------------

  premerge_check:
    description: >
      Merge — om-merge-buddy reports, read-only, whether this PR can merge now
      or is close but blocked.
    action:
      type: agent
      harness: claude-code
      prompt: |
        Run the `om-merge-buddy` skill for this pull request. Read-only:
        report, do not merge. A `needs-qa` PR without `qa-approved` is blocked;
        so are `qa-failed`, `blocked`, `do-not-merge`, an active `qa` label and
        an `in-progress` claim. QA evidence older than the head is reported as
        stale rather than silently accepted.

        End your answer with a single JSON object and nothing after it:
          {"output": "<label>", "data": {"blockers": []}}
        Use exactly one of these labels:
          - "mergeable" — every gate is satisfied and the checks are green.
          - "merge_blocked" — name the blocking gate in `data.blockers`.
    outputs:
      - mergeable
      - merge_blocked
    transitions:
      mergeable: approve_merge
      merge_blocked: blocked_gate
    timeout: 30m
    retry_policy:
      max_attempts: 2
      backoff: 30s

  approve_merge:
    description: >
      HUMAN GATE — the irreversible one. om-approve-merge-pr re-checks every
      gate before the squash-merge, and a squash-merge into main is the point
      of no return in this process: after it, delivery belongs to the release
      process, not here.
    action:
      type: human
      message: >
        Every gate reports satisfied. Approving squash-merges this pull request
        into `main` — the point of no return for this process. Merge, hold it
        (a human `do-not-merge`), or stop.
      inputs:
        - name: merge_decision
          type: select
          required: true
          options:
            - merge
            - hold
            - abandon
        - name: merge_notes
          type: text
          required: false
          description: Why you are holding it, if you are.
    outputs:
      - merge
      - hold
      - abandon
    transitions:
      merge: merge_pr
      hold: blocked_gate
      abandon: cancelled

  merge_pr:
    description: >
      Merge — om-approve-merge-pr re-checks every gate, approves and
      squash-merges.
    action:
      type: agent
      harness: claude-code
      prompt: |
        Run the `om-approve-merge-pr` skill. Re-check every gate yourself
        before touching the merge button — `needs-qa` without `qa-approved`,
        `qa-failed`, `blocked`, `do-not-merge`, an active `qa` label, red
        required checks — then approve and squash-merge into `main`. Refuse
        rather than merge if any gate fails or the QA evidence is older than
        the head.

        End your answer with a single JSON object and nothing after it:
          {"output": "<label>", "data": {"merge_commit": "<sha or null>"}}
        Use exactly one of these labels:
          - "merged" — squash-merged into main.
          - "merge_refused" — a gate failed on the re-check; nothing merged.
    outputs:
      - merged
      - merge_refused
    transitions:
      merged: housekeeping
      merge_refused: blocked_gate
    timeout: 30m

  housekeeping:
    description: >
      Post-merge housekeeping — close the issues the merged PR fixes, comment
      on issues whose PRs closed unmerged, and file the leftovers as follow-up
      issues. Merge is where this process ends.
    action:
      type: agent
      harness: claude-code
      prompt: |
        Run `om-close-fixed-issues` and `om-followup-issue-from-pr` for the
        merged pull request. Close what it fixes — never an issue labelled
        `do-not-close` — and turn leftover asks and unresolved review comments
        into tracked follow-up issues. Stop at the tracker: deployment, smoke
        tests and monitoring belong to the release process, not this one.

        End your answer with a single JSON object and nothing after it:
          {"output": "<label>", "data": {"closed": <count>, "follow_ups": <count>}}
        Use exactly one of these labels:
          - "reconciled" — the tracker matches reality and follow-ups are filed.
          - "housekeeping_incomplete" — something could not be reconciled; it
            is named on the PR.
    outputs:
      - reconciled
      - housekeeping_incomplete
    transitions:
      reconciled: completed
      housekeeping_incomplete: completed
    timeout: 30m
    retry_policy:
      max_attempts: 2
      backoff: 30s

  # -------------------------------------------------------------------------
  # The human-owned block
  # -------------------------------------------------------------------------

  blocked_gate:
    description: >
      HUMAN GATE — `blocked` and `do-not-merge` are set and cleared by humans
      and stop the flow wherever it is. Every dead end in this pipeline routes
      here rather than failing silently, so that a person decides whether the
      work resumes, goes back for re-review, or ends.
    action:
      type: human
      message: >
        The pipeline is blocked and only a human clears a block. Decide where
        it resumes: back to implementation, back to review, or stop here.
      inputs:
        - name: block_decision
          type: select
          required: true
          options:
            - resume_implementation
            - resume_review
            - abandon
        - name: block_notes
          type: text
          required: false
          description: What you cleared, and what the next step must respect.
    outputs:
      - resume_implementation
      - resume_review
      - abandon
    transitions:
      resume_implementation: implement
      resume_review: code_review
      abandon: cancelled

  # -------------------------------------------------------------------------
  # Terminals
  # -------------------------------------------------------------------------

  completed:
    description: Squash-merged into main, with the tracker reconciled behind it.

  closed_no_action:
    description: >
      Closed cleanly with nothing to do — nothing worth building, not
      reproducible, already fixed, or already claimed by somebody else.

  failed:
    description: The pipeline could not carry the ticket further.

  cancelled:
    description: A person stopped the pipeline.

terminal_states:
  completed: completed
  closed_no_action: completed
  failed: failed
  cancelled: cancelled
