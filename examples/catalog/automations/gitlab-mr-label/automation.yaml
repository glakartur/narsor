# A review label on a GitLab merge request, for a queue of review gates
# (mode on_episodes). Read docs/user/observers.md first.
#
#   in.sh     adds the label when the gate starts to wait
#   check.sh  answers the gate when the reviewer removed the label
#   out.sh    removes the label when the gate exits (if it is still there)
#
# The queue's condition (the same object for every automation of the queue):
#   gitlab.host     the host of the merge request URLs. Required.
#   gitlab.api_url  the https:// address of the REST API. Default:
#                   https://HOST/api/v4.
#   label           the review label. Default: narsor-review. No comma.
#
# Params of the gate (`watch.params`):
#   mr_url   the merge request URL:
#              https://HOST/GROUP/PROJECT/-/merge_requests/IID
#            (subgroups allowed). Required.
#   choice   the choice that check.sh gives the gate. Default:
#            check_feedback.
#
# A URL that is not a merge request URL on gitlab.host is not an entry of
# this automation: each script exits 0 and sends the token nowhere. So this
# automation and github-pr-label can serve one queue.
description: Puts a review label on a GitLab merge request while the gate waits, and answers the gate when the reviewer removes it
params: [mr_url, choice]
secrets:
  # A token with the `api` scope: the scripts read the merge request and
  # change its labels. The value is the file {observer secrets dir}/gitlab-token.
  - {name: gitlab-token, env: GITLAB_TOKEN}
